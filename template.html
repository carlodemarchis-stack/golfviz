<!DOCTYPE html>
<html lang="en">
<head>

<meta property="og:description" content="An interactive golf experience: the FedExCup top 70 and all 37 tournaments of the 2026 season. Best experienced in landscape on laptops & iPads — but also great on your smartphone in portrait.">
<meta property="og:url" content="https://golf.aguywithascarf.com/">

<meta name="twitter:description" content="An interactive golf experience: the FedExCup top 70 and all 37 tournaments of the 2026 season.">
<meta name="twitter:image" content="https://golf.aguywithascarf.com/img/og.png?v=1">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
:root{
  --bg:#070910; --panel:rgba(255,255,255,.055); --panel2:rgba(255,255,255,.014);
  --line:rgba(150,166,205,.14); --ink:#eef2fb; --dim:#93a0bd; --dim2:#66718c;
  --acc:#f2952e; --acc2:#7c5cff;
  --major:#f2952e; --playoff:#e8534e; --signature:#7c5cff; --players:#3fbe72;
  --full:#4a86e8; --opposite:#66718c;
  --r:20px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-weight:300;
  -webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
[hidden]{display:none!important}   /* author display rules otherwise beat the hidden attribute */

/* ---------------------------------------------------------------- film */
#film{position:fixed;inset:0;display:flex;transition:transform .55s cubic-bezier(.16,.84,.34,1);
  will-change:transform}
.card{flex:0 0 100vw;width:100vw;height:100dvh;position:relative;overflow:hidden}
.inner{position:absolute;inset:0;padding:clamp(18px,3.2vw,54px);
  padding-top:clamp(50px,7.5vh,78px);
  padding-bottom:clamp(76px,9.5vh,104px);display:flex;gap:clamp(16px,2.4vw,40px)}

/* ------------------------------------------------------------- player */
/* top bar = card chrome (experience + credit), never player data */
.pl-inner{flex-direction:column;gap:0}
.pbody{flex:1 1 auto;min-height:0;display:flex;gap:clamp(16px,2.6vw,44px)}
.pcol{flex:0 0 43%;min-width:0;display:flex;flex-direction:column;
  gap:clamp(9px,1.5vh,18px);justify-content:flex-start}

/* left top: photo, with personal info + all-time record beside it */
.ptop{flex:0 0 auto;display:flex;gap:clamp(12px,1.8vw,26px);
  align-items:stretch;min-width:0}
.pphoto{flex:0 0 clamp(128px,14.2vw,216px);height:auto;aspect-ratio:7/6;
  position:relative;border-radius:var(--r);
  overflow:hidden;background:linear-gradient(160deg,var(--panel),var(--panel2));
  border:1px solid var(--line)}
.pphoto::after{content:"";position:absolute;inset:0;z-index:0;
  background:radial-gradient(120% 80% at 50% 108%,rgba(242,149,46,.22),transparent 62%)}
.phrank{position:absolute;left:0;right:0;top:-1.5%;z-index:1;text-align:center;
  font-size:clamp(96px,12.5vw,190px);font-weight:700;line-height:.78;letter-spacing:-.05em;
  color:rgba(186,199,226,.17);pointer-events:none}
.pphoto img{position:absolute;left:50%;bottom:0;transform:translateX(-50%);
  height:88%;width:auto;object-fit:contain;object-position:bottom;z-index:2;
  filter:drop-shadow(0 14px 32px rgba(0,0,0,.55))}
.pinfo{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;
  justify-content:center;gap:clamp(4px,.8vh,10px)}
.pinfo > *{flex:0 0 auto}
/* full-width stat boxes below the photo block */
.pbox{flex:0 0 auto;background:linear-gradient(160deg,var(--panel),var(--panel2));
  border:1px solid var(--line);border-radius:16px;
  padding:clamp(8px,1.15vh,15px) clamp(11px,1.2vw,18px)}
.boxlegend{font-size:clamp(8.5px,.82vw,10.5px);letter-spacing:.2em;text-transform:uppercase;
  color:var(--dim2);font-weight:700;margin-bottom:clamp(5px,.85vh,10px)}
.boxgrid{display:grid;gap:clamp(6px,1vw,16px)}
.boxgrid.four{grid-template-columns:repeat(4,1fr)}
.boxgrid.six{grid-template-columns:repeat(6,1fr)}
.boxgrid.seven{grid-template-columns:repeat(7,1fr)}
.pstats{flex:0 0 auto;min-width:0;display:flex;flex-direction:column;
  gap:clamp(9px,1.5vh,18px)}
/* one start, in place of the season boxes */
.pevent{flex:0 1 auto;min-width:0;min-height:0;overflow-y:auto;overflow-x:hidden;
  scrollbar-width:thin;overscroll-behavior:contain;
  background:linear-gradient(160deg,var(--panel),var(--panel2));
  border:1px solid var(--line);border-radius:16px;
  padding:clamp(10px,1.4vh,18px) clamp(12px,1.3vw,20px)}
.pehead{position:relative;padding-right:104px}
.pehead h4{font-weight:700;line-height:27px;letter-spacing:-.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pehead p{font-size:clamp(9.5px,.9vw,12px);color:var(--dim2);margin-top:3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pehead p b{color:var(--ink);font-weight:700}
.pback{position:absolute;top:0;right:0;padding:4px 11px;border-radius:999px;
  border:1px solid var(--line);background:rgba(12,16,26,.55);color:var(--dim);
  font-size:clamp(8.5px,.8vw,10.5px);letter-spacing:.1em;text-transform:uppercase;
  transition:.18s;white-space:nowrap}
.pback:hover{color:var(--acc);border-color:rgba(242,149,46,.45)}
.pevent .mgrid{margin:clamp(9px,1.3vh,15px) 0 2px}
.hgrid.eg{margin-top:clamp(8px,1.1vh,13px)}
.hgrid.eg .hcell,.hgrid.eg .scell{min-height:clamp(15px,2.6vh,29px)}
.hgrid.eg .sq{width:clamp(17px,1.35vw,23px);height:clamp(17px,1.35vw,23px);font-size:11px}
.egcourse + .hgrid.eg{margin-top:3px}
.egcourse{margin-top:clamp(8px,1.1vh,13px);font-size:clamp(8.5px,.8vw,10.5px);
  letter-spacing:.16em;text-transform:uppercase;color:var(--dim2);font-weight:700}
.pevent .sclegend{margin-top:clamp(7px,1vh,12px)}
.egnote{margin-top:clamp(6px,.9vh,10px);font-size:clamp(9px,.84vw,11px);
  line-height:1.35;color:var(--dim2)}
.egnote b{color:var(--dim);font-weight:700}
.pewon{margin-top:9px;font-size:clamp(9px,.86vw,11px);color:var(--dim2)}

.pbox.mix{padding-bottom:0;overflow:hidden}
.pmix{display:flex;height:clamp(7px,1.05vh,11px);overflow:hidden;
  margin:clamp(8px,1.1vh,14px) calc(-1 * clamp(12px,1.35vw,20px)) 0}
.pmix i{display:block;height:100%}
.cell{min-width:0}
.cell b{display:block;font-size:clamp(12px,1.13vw,17.5px);font-weight:700;line-height:1;
  letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell i{display:block;font-style:normal;font-size:clamp(8.5px,.8vw,10.5px);
  letter-spacing:.12em;text-transform:uppercase;color:var(--dim2);margin-top:5px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell.hero b{color:var(--acc)}
.cell.world b{color:var(--acc2)}
.cell b small{font-size:.55em;font-weight:300;color:var(--dim);letter-spacing:0}
.cell b em{font-style:normal;font-size:.42em;font-weight:400;color:var(--dim2);
  letter-spacing:0;margin-left:.3em}

.pres{flex:1 1 57%;min-width:0;display:flex;flex-direction:column;
  gap:clamp(8px,1.3vh,16px)}

.crumb{display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  font-size:clamp(10px,1.05vw,13px);letter-spacing:.16em;text-transform:uppercase;color:var(--dim2)}
.crumb b{color:var(--acc);font-weight:700}
.fl{height:.95em;width:auto;vertical-align:-.08em;margin-right:6px;border-radius:2px;
  box-shadow:0 0 0 1px rgba(255,255,255,.12)}
.pname{font-weight:700;letter-spacing:-.03em;line-height:1.16;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.psub{display:flex;gap:clamp(10px,1.6vw,26px);flex-wrap:wrap;align-items:baseline;
  font-size:clamp(11px,1.15vw,14px);color:var(--dim)}
.psub b{color:var(--ink);font-weight:400}


.tabs{display:flex;gap:6px}
.tab{padding:6px 14px;border-radius:999px;border:1px solid var(--line);
  font-size:clamp(10px,1vw,12px);letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.tab.on{background:var(--acc);color:#140b02;border-color:var(--acc);font-weight:700}

.pane{flex:1 1 auto;min-height:0;overflow:hidden;position:relative}
.evlist{height:100%;display:flex;flex-direction:column;gap:1px;overflow:hidden}
.ev,.evhead{display:grid;
  grid-template-columns:58px minmax(0,1fr) 46px 92px 44px 46px 52px 62px;
  gap:8px;align-items:center;padding:0 9px}
.ev{border-radius:9px;font-size:clamp(9.5px,.98vw,13px);
  cursor:pointer;border:1px solid transparent;line-height:1;overflow:hidden;
  flex:1 1 0;min-height:0;max-height:30px}
.evhead{flex:0 0 auto;color:var(--dim2);font-size:clamp(8.5px,.82vw,10.5px);
  letter-spacing:.13em;text-transform:uppercase;padding-bottom:6px;margin-bottom:3px;
  border-bottom:1px solid var(--line)}
.evhead .r,.evhead .tt,.evhead .tp,.evhead .pt,.evhead .mo{text-align:right}
.ev .tt,.ev .tp{text-align:right;font-variant-numeric:tabular-nums;color:var(--dim)}
.ev .mo{text-align:right;font-variant-numeric:tabular-nums;color:var(--dim);
  overflow:hidden;text-overflow:ellipsis}
.ev.win .tt,.ev.win .tp,.ev.win .mo{color:var(--ink)}
.ev:hover{background:var(--panel);border-color:var(--line)}
.ev .d{color:var(--dim2);font-size:.88em;font-variant-numeric:tabular-nums}
.ev .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev .p{font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.ev .r{color:var(--dim);font-variant-numeric:tabular-nums;letter-spacing:.06em;
  text-align:right;font-size:.92em}
.ev .pt{text-align:right;color:var(--acc);font-variant-numeric:tabular-nums;font-size:.95em}
.ev.cut .pt,.ev.cut .tt,.ev.cut .tp,.ev.cut .mo{color:var(--dim2)}
.ev.win{background:linear-gradient(90deg,rgba(242,149,46,.20),rgba(242,149,46,.03));
  border-color:rgba(242,149,46,.34)}
.ev.win .n{font-weight:700}
/* after .ev.win, so a week he won still shows as the selected one */
.ev.sel,.ev.win.sel{background:rgba(238,242,251,.10);
  border-color:rgba(238,242,251,.40);box-shadow:inset 3px 0 0 var(--ink)}
.ev.sel .n{color:var(--ink);font-weight:700}
.ev.top10 .p{color:var(--acc)}
.ev.cut .p,.ev.cut .n{color:var(--dim2)}

.statpane{height:100%;overflow:hidden;display:flex;flex-direction:column;
  gap:clamp(6px,1vh,12px)}
.sgblock{flex:0 0 auto}
.sglab{font-size:clamp(8.5px,.82vw,10.5px);letter-spacing:.18em;text-transform:uppercase;
  color:var(--dim2);font-weight:700;margin-bottom:clamp(4px,.8vh,9px)}
.sgrow{display:grid;grid-template-columns:118px 1fr 56px 42px;gap:9px;align-items:center;
  font-size:clamp(9.5px,.95vw,12px);margin-bottom:clamp(3px,.55vh,7px)}
.sgrow .t{color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sgrow.tot .t{color:var(--ink);font-weight:700}
.sgaxis{position:relative;height:clamp(11px,1.8vh,18px);background:rgba(255,255,255,.03);
  border-radius:4px}
.sgaxis::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;
  background:rgba(150,166,205,.35)}
.sgfill{position:absolute;top:2px;bottom:2px;border-radius:3px}
.sgfill.pos{background:linear-gradient(90deg,rgba(63,224,138,.55),#3fe08a)}
.sgfill.neg{background:linear-gradient(90deg,#e8534e,rgba(232,83,78,.55))}
.sgrow .v{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.sgrow .rk{text-align:right;font-variant-numeric:tabular-nums;color:var(--dim2);
  font-size:.88em}
.sgrow .rk b{color:var(--acc);font-weight:700}
.stgrid{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:repeat(2,1fr);
  gap:0 clamp(14px,2.2vw,34px);align-content:start}
.stcol{display:flex;flex-direction:column;gap:clamp(2px,.45vh,6px);min-width:0}
.sgnote{flex:0 0 auto;margin-top:clamp(8px,1.4vh,18px);padding-top:clamp(7px,1.1vh,13px);
  border-top:1px solid var(--line);font-size:clamp(9px,.9vw,11.5px);line-height:1.5;
  color:var(--dim2);max-width:70ch}
.sgnote b{color:#3fe08a;font-weight:700}
.stgrp{font-size:clamp(8px,.78vw,10px);letter-spacing:.16em;text-transform:uppercase;
  color:var(--acc);font-weight:700;margin-top:clamp(4px,.8vh,10px)}
.stcol > .stgrp:first-child{margin-top:0}
.strow{display:grid;grid-template-columns:1fr 62px 40px;gap:8px;align-items:center;
  font-size:clamp(9px,.92vw,11.5px);min-height:0}
.strow .t{color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.strow .v{text-align:right;font-variant-numeric:tabular-nums}
.strow .rk{text-align:right;font-variant-numeric:tabular-nums;color:var(--dim2);font-size:.88em}
.strow .rk b{color:var(--acc);font-weight:700}

.none{font-size:clamp(11px,1.05vw,13.5px);color:var(--dim2);font-style:italic}

/* --------------------------------------------------------- tournament */
.t-bg{position:absolute;inset:0;z-index:0}
.t-bg img{width:100%;height:100%;object-fit:cover;opacity:.42}
.t-bg::after{content:"";position:absolute;inset:0;
  background:linear-gradient(100deg,rgba(7,9,16,.97) 30%,rgba(7,9,16,.62) 62%,rgba(7,9,16,.42))}
.t-bg.nophoto{background:
  radial-gradient(90% 120% at 88% 10%,rgba(242,149,46,.16),transparent 60%),
  linear-gradient(140deg,#0d1420,#070910 60%)}
/* the player card only carries a photo while a week is open */
.p-bg{transition:opacity .35s}
.p-bg.nophoto{background:none}
.p-bg.nophoto img{display:none}
.p-bg.nophoto::after{content:none}
.pl-inner{z-index:1}
.t-inner{z-index:1}
.t-left{flex:1 1 52%;min-width:0;display:flex;flex-direction:column;gap:clamp(9px,1.4vh,18px)}
.t-right{flex:1 1 46%;min-width:0;display:flex;flex-direction:column;gap:clamp(8px,1.2vh,14px)}
.thead{display:flex;align-items:center;gap:clamp(12px,1.6vw,22px);min-width:0}
.tlogo{height:clamp(52px,8.4vh,104px);width:auto;flex:0 0 auto;object-fit:contain;
  filter:drop-shadow(0 6px 18px rgba(0,0,0,.6))}
.tname{flex:1 1 auto;min-width:0;font-weight:700;letter-spacing:-.028em;line-height:1.05}
.twin{flex:0 0 auto;display:flex;align-items:center;gap:clamp(8px,1vw,14px);
  padding-left:clamp(10px,1.4vw,20px);border-left:1px solid var(--line);max-width:46%}
.twin img{width:clamp(34px,4vw,54px);height:clamp(34px,4vw,54px);border-radius:50%;
  object-fit:cover;background:rgba(255,255,255,.05);flex:0 0 auto}
.tw-t{min-width:0;display:flex;flex-direction:column;align-items:flex-end;text-align:right}
.tw-t .lbl{font-size:clamp(8.5px,.8vw,10.5px);letter-spacing:.18em;text-transform:uppercase;
  color:var(--acc);font-weight:700}
.tw-t .nm{color:var(--ink);font-weight:700;letter-spacing:-.02em;line-height:1.14;
  margin:1px 0 2px;max-width:100%;overflow-wrap:anywhere}
.tw-t .cd{font-size:clamp(9px,.92vw,11.5px);color:var(--dim);max-width:100%;
  overflow-wrap:anywhere}
.tmeta{display:flex;gap:clamp(9px,1.5vw,22px);flex-wrap:wrap;
  font-size:clamp(10px,1.08vw,13.5px);color:var(--dim)}
.tmeta b{color:var(--ink);font-weight:400}
.badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:clamp(9px,.9vw,11px);
  letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:#0a0d14}
/* ---- per-hole field scoring, below the tournament's info ---- */
.hpanel{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;
  gap:clamp(6px,1vh,12px);margin-top:clamp(8px,1.4vh,18px);
  padding-top:clamp(8px,1.3vh,16px);border-top:1px solid var(--line);max-width:760px}
.hptop{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hpills{display:flex;gap:4px}
.hpills button{padding:3px 10px;border-radius:999px;border:1px solid var(--line);
  font-size:clamp(8.5px,.82vw,10.5px);letter-spacing:.1em;text-transform:uppercase;
  color:var(--dim);background:rgba(12,16,26,.5)}
.hpills button.on{background:var(--acc);color:#140b02;border-color:var(--acc);font-weight:700}
.hcourse{font-size:clamp(9px,.88vw,11px);color:var(--dim2);letter-spacing:.06em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.hcov{font-size:clamp(9px,.88vw,11.5px);color:var(--dim2)}
.hcov b{color:var(--dim);font-weight:700}
.hkpis{display:flex;gap:clamp(10px,1.8vw,26px);flex-wrap:wrap;
  font-size:clamp(9px,.88vw,11.5px);color:var(--dim2)}
.hkpis b{color:var(--ink);font-weight:700}
.hkpis .hard{color:#e8534e}.hkpis .easy{color:#3fe08a}
.hgrid{flex:0 0 auto;display:grid;
  grid-template-columns:42px repeat(9,minmax(0,1fr)) minmax(0,1.3fr)
                              repeat(9,minmax(0,1fr)) minmax(0,1.3fr) minmax(0,1.3fr);
  gap:2px;align-content:start}
.hhead.sum .hn{color:var(--dim2);letter-spacing:.04em}
/* how the nine played, summed - text, not a cell, and never clickable */
.hsum{display:flex;align-items:center;justify-content:center;
  font-size:clamp(7.5px,.73vw,9.5px);font-variant-numeric:tabular-nums;
  color:var(--dim2);border-radius:5px;background:rgba(255,255,255,.035)}
.hsum.tot{color:var(--ink);font-weight:700;background:rgba(255,255,255,.075)}
.hgrid > div{min-width:0}
.hhead{text-align:center;line-height:1.1;padding-bottom:2px}
.hhead .hn{display:block;font-size:clamp(8.5px,.8vw,11px);font-weight:700;color:var(--dim)}
.hhead .hp{display:block;font-size:clamp(7px,.64vw,9px);color:var(--dim2)}
.hrlab{display:flex;align-items:center;font-size:clamp(7.5px,.72vw,9.5px);
  letter-spacing:.1em;color:var(--dim2);font-weight:700}
.hrlab.all{color:var(--acc)}
.hgrid .gap{grid-column:1 / -1;height:clamp(4px,.7vh,9px)}
.hcell{border-radius:5px;text-align:center;cursor:pointer;border:1px solid transparent;
  display:flex;align-items:center;justify-content:center;
  font-size:clamp(7.5px,.73vw,9.5px);font-variant-numeric:tabular-nums;
  color:rgba(255,255,255,.72);min-height:clamp(14px,3vh,33px)}
.hcell.na{background:none;cursor:default;color:transparent}
.hcell.sel{border-color:var(--acc);box-shadow:0 0 0 1px rgba(242,149,46,.55);
  color:var(--ink);font-weight:700}
/* one player's card, in the heat map's columns - a score sits under its hole */
.sclab{grid-column:1 / -1;display:flex;align-items:baseline;gap:clamp(6px,.9vw,12px);
  flex-wrap:wrap;padding-bottom:3px;font-size:clamp(8.5px,.82vw,11px);color:var(--dim2)}
.sclab b{color:var(--acc);font-weight:700;font-size:clamp(10px,.96vw,13px)}
.sclab span{font-variant-numeric:tabular-nums;color:var(--dim)}
.sclab em{font-style:normal;color:var(--dim2)}
.sclab i{font-style:normal;margin-left:auto;color:var(--dim2);opacity:.7;
  font-size:clamp(7.5px,.7vw,9.5px);letter-spacing:.06em}
.sclab.fieldlab b{color:var(--dim)}
.hrlab.sc,.hrlab.me{color:var(--acc)}
.hrlab.gaprow{color:var(--ink)}
.scell{display:flex;align-items:center;justify-content:center;
  min-height:clamp(14px,3vh,33px)}
.hgrid .sq{width:clamp(17px,1.45vw,25px);height:clamp(17px,1.45vw,25px);
  font-size:clamp(9px,.8vw,12px)}

.d2{background:rgba(232,83,78,.42)}.d1{background:rgba(232,83,78,.20)}
.d0{background:rgba(150,166,205,.13)}
.e1{background:rgba(63,224,138,.20)}.e2{background:rgba(63,224,138,.40)}
.hbox{grid-column:1 / -1;min-width:0;display:flex;flex-direction:column;
  margin:clamp(6px,.9vh,11px) 0;
  background:linear-gradient(140deg,var(--panel),var(--panel2));border:1px solid var(--line);
  border-radius:14px;padding:clamp(8px,1.2vh,14px) clamp(10px,1.2vw,16px)}
/* the box takes whatever the two grids leave, and the distribution grows into it
   rather than floating a thin bar in an empty panel */
.hdet{flex:0 0 auto;min-height:0;display:grid;grid-template-columns:auto 1fr;
  gap:clamp(8px,1.4vw,20px);align-items:stretch}
.hdet .lead{align-self:center}
.hdet > div:last-child{display:flex;flex-direction:column;justify-content:center;min-height:0}
.hdet .lead{font-size:clamp(10px,1vw,13px);color:var(--dim);white-space:nowrap}
.hdet .lead b{color:var(--ink);font-size:clamp(13px,1.35vw,18px);font-weight:700}
.hdet .lead i{font-style:normal;color:var(--acc);font-weight:700}
.hmix{display:flex;flex:1 1 auto;min-height:clamp(11px,2.2vh,22px);max-height:34px;
  border-radius:6px;overflow:hidden}
.hmix i{display:block;height:100%}
.hcounts{display:flex;gap:clamp(7px,1.2vw,16px);flex-wrap:wrap;margin-top:5px;
  font-size:clamp(8.5px,.8vw,10.5px);color:var(--dim2)}
.hcounts span b{color:var(--ink);font-weight:700;margin-right:3px}
.hwho{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;
  margin-top:clamp(7px,1.1vh,13px);padding-top:clamp(7px,1.1vh,13px);
  border-top:1px solid var(--line)}
.hwho:only-child{margin-top:0;padding-top:0;border-top:0}
.hwho .lbl{font-size:clamp(8px,.76vw,10px);letter-spacing:.16em;text-transform:uppercase;
  color:var(--dim2);font-weight:700;margin-bottom:clamp(4px,.7vh,8px)}
.hwcols{flex:1 1 auto;min-height:0;display:grid;gap:clamp(6px,1vw,14px)}
.hwcol{min-width:0;min-height:0;display:flex;flex-direction:column}
.hwhead{font-size:clamp(8.5px,.8vw,10.5px);font-weight:700;padding-bottom:3px;
  margin-bottom:4px;border-bottom:1px solid var(--line);display:flex;
  justify-content:space-between;gap:6px}
.hwhead span:last-child{color:var(--dim2);font-weight:400}
.hwcol ul{list-style:none;flex:1 1 auto;min-height:0;overflow:hidden;
  column-width:clamp(58px,6vw,84px);column-gap:clamp(6px,.9vw,14px)}
.hwcol li{break-inside:avoid}
.hwcol li{font-size:clamp(8.5px,.82vw,11px);color:var(--dim);overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.hwnote{font-size:clamp(9px,.86vw,11px);color:var(--dim2);font-style:italic}



.lb{flex:1 1 auto;min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:1px}
.lb.open{overflow-y:auto;scrollbar-width:thin}
.lbmore{flex:0 0 auto;align-self:flex-start;margin-top:6px;padding:3px 12px;border-radius:999px;
  border:1px solid var(--line);font-size:clamp(8.5px,.82vw,10.5px);letter-spacing:.11em;
  text-transform:uppercase;color:var(--dim);background:rgba(12,16,26,.55);transition:.18s}
.lbmore:hover{color:var(--acc);border-color:rgba(242,149,46,.45)}
.lbhead,.lbrow{display:grid;grid-template-columns:42px 1fr 104px 52px;gap:8px;align-items:center;
  padding:0 10px;font-size:clamp(9.5px,.98vw,12.5px)}
.lbrow{flex:0 0 auto;height:clamp(17px,2.45vh,23px);line-height:1;overflow:hidden}
.lbhead{color:var(--dim2);font-size:clamp(9px,.85vw,11px);letter-spacing:.13em;
  text-transform:uppercase;border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:3px}
.lbrow{border-radius:8px}
.lbrow:nth-child(even){background:rgba(255,255,255,.022)}
.lbrow.w{background:linear-gradient(90deg,rgba(242,149,46,.20),rgba(242,149,46,.02));
  font-weight:700}
.lbrow .pos{color:var(--dim);font-variant-numeric:tabular-nums}
.lbrow.w .pos{color:var(--acc)}
.lbrow .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lbrow .rd{color:var(--dim2);font-variant-numeric:tabular-nums;letter-spacing:.05em;
  text-align:right;font-size:.84em}
.lbrow .tot{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
/* the selected hole's score, per player, in leaderboard order */
.t-right:not(.hole) .hs{display:none}
.t-right.hole .lbhead,.t-right.hole .lbrow{
  grid-template-columns:42px 1fr 104px 52px clamp(28px,2.6vw,36px)}
.lbrow .hs{display:flex;align-items:center;justify-content:center}
.lbrow .hs .sq{width:clamp(13px,2vh,19px);height:clamp(13px,2vh,19px);
  font-size:clamp(8.5px,1.05vh,10.5px)}
.lbrow .hs i{font-style:normal;color:var(--dim2);opacity:.35}
.lbhead .hs{text-align:center;color:var(--acc);font-variant-numeric:tabular-nums}
/* the row whose card is drawn on the left - neutral, so it never reads as the
   orange that means "won this one" */
.lbrow.sel,.lbrow.w.sel{background:rgba(238,242,251,.10);
  border-color:rgba(238,242,251,.42);box-shadow:inset 3px 0 0 var(--ink)}
.lbrow.sel .nm{color:var(--ink);font-weight:700}
/* a row we hold a scorecard for opens it; the Zurich teams do not have one */
.lbrow.has{cursor:pointer;border:1px solid transparent}
.lbrow.has:hover{background:var(--panel);border-color:rgba(242,149,46,.35)}
.lbrow.has:hover .nm{color:var(--acc)}
.lbrow.w.has:hover{background:linear-gradient(90deg,rgba(242,149,46,.30),rgba(242,149,46,.05))}
.lbrow.sel.has:hover,.lbrow.w.sel.has:hover{background:rgba(238,242,251,.16)}

/* -------------------------------------------------------------- chart */
.chartwrap{flex:1 1 100%;min-width:0;display:flex;flex-direction:column;
  gap:clamp(8px,1.4vh,18px)}
.chead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.ctitle{font-size:clamp(20px,2.9vw,46px);font-weight:700;letter-spacing:-.03em;line-height:1}
.cnote{font-size:clamp(10px,1.02vw,13px);color:var(--dim);max-width:62ch;line-height:1.5}
.rows{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:2px;overflow:hidden}
.rrow{display:grid;grid-template-columns:34px 1fr;gap:9px;align-items:center;
  font-size:clamp(10px,1vw,12.5px);flex:1 1 0;min-height:0}
.rrow .bar{height:100%;max-height:26px}
.rrow .rk{color:var(--dim2);text-align:right;font-variant-numeric:tabular-nums}
.bar{position:relative;height:clamp(15px,2.5vh,26px);border-radius:6px;
  background:rgba(255,255,255,.035);overflow:hidden}
.fill{position:absolute;inset:0 auto 0 0;border-radius:6px;
  background:linear-gradient(90deg,rgba(242,149,46,.55),var(--acc))}
.rrow:first-child .fill{background:linear-gradient(90deg,rgba(242,149,46,.8),#ffc477)}
.blab{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;
  padding:0 10px;z-index:1}
.blab .who{font-weight:400;text-shadow:0 1px 3px rgba(0,0,0,.75);overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.blab .val{font-variant-numeric:tabular-nums;font-weight:700;
  text-shadow:0 1px 3px rgba(0,0,0,.75);flex:0 0 auto;padding-left:10px}
.rrow:first-child .blab{color:#180d02}
.rrow:first-child .blab .who,.rrow:first-child .blab .val{text-shadow:none}
.dcols{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:repeat(2,1fr);
  gap:0 clamp(16px,3vw,48px);grid-auto-flow:column;grid-template-rows:repeat(15,1fr)}
.drow{display:grid;grid-template-columns:30px 1fr 74px 74px 56px;gap:8px;align-items:center;
  font-size:clamp(9.5px,.98vw,12.5px);padding:0 6px;border-radius:7px}
.drow.h{color:var(--dim2);font-size:clamp(8.5px,.82vw,10.5px);letter-spacing:.12em;
  text-transform:uppercase;border-bottom:1px solid var(--line)}
.drow .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drow .n1,.drow .n2{text-align:right;font-variant-numeric:tabular-nums}
.drow .dd{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.up{color:#3fbe72}.down{color:#e8534e}.flat{color:var(--dim2)}

/* holes-played composition */
.hcols{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:repeat(2,1fr);
  gap:0 clamp(16px,2.6vw,40px);grid-auto-flow:column;grid-template-rows:repeat(35,1fr)}
.hrow{display:grid;grid-template-columns:26px 96px 1fr 42px;gap:7px;align-items:center;
  min-height:0;font-size:clamp(8.5px,.86vw,11px)}
.hrow .rk{color:var(--dim2);text-align:right;font-variant-numeric:tabular-nums}
.hrow .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--dim)}
.hrow .hn{text-align:right;font-variant-numeric:tabular-nums;color:var(--dim);font-weight:700}
.htrack{height:clamp(9px,1.5vh,15px);border-radius:4px;overflow:hidden;
  background:rgba(255,255,255,.03)}
.hbar{height:100%;display:flex;border-radius:4px;overflow:hidden;
  width:var(--w);transition:width .35s cubic-bezier(.16,.84,.34,1)}
.hcols.pct .hbar{width:100%}
.hbar i{display:block;height:100%}
.s-eagle{background:#3fe08a}
.s-birdie{background:var(--acc)}
.s-par{background:rgba(150,166,205,.34)}
.s-bogey{background:#5d6b8f}
.s-dbl{background:#c9453f}
/* how a season broke down: won, top 10, top 25, made the cut, missed it */
.s-win{background:var(--acc)}
.s-t10{background:rgba(242,149,46,.52)}
.s-t25{background:rgba(150,166,205,.42)}
.s-rest{background:rgba(150,166,205,.20)}
.s-cut{background:#c9453f}
.hkey{display:flex;gap:15px;flex-wrap:wrap;font-size:clamp(9px,.9vw,11px);color:var(--dim2);
  align-items:center;margin-top:2px}
.hmode{display:flex;gap:5px;margin-left:auto}
.hmode button{padding:4px 12px;border-radius:999px;border:1px solid var(--line);
  font-size:clamp(9px,.88vw,11px);letter-spacing:.11em;text-transform:uppercase;color:var(--dim)}
.hmode button:hover{color:var(--ink)}
.hmode button.on{background:var(--acc);color:#140b02;border-color:var(--acc);font-weight:700}
.hkey span{display:flex;gap:6px;align-items:center}
.hkey b{width:11px;height:11px;border-radius:3px;display:block;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.16)}

.mcols{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:repeat(2,1fr);
  gap:0 clamp(18px,3vw,46px);grid-auto-flow:column;grid-template-rows:repeat(15,1fr)}
.mrow{display:grid;grid-template-columns:24px auto minmax(74px,124px) 1fr auto;gap:8px;
  align-items:center;min-height:0}
.mrow .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-size:clamp(9.5px,.98vw,12.5px)}
.mrow .amt{font-variant-numeric:tabular-nums;font-weight:700;text-align:right;
  font-size:clamp(9.5px,.98vw,12.5px);min-width:52px}
.mrow:first-child .nm b,.mrow:first-child .amt{color:var(--acc)}
.mrow .rk{color:var(--dim2);text-align:right;font-variant-numeric:tabular-nums;
  font-size:clamp(9.5px,.95vw,12px)}
.mrow .fc{width:clamp(22px,2.8vh,34px);height:clamp(22px,2.8vh,34px);border-radius:50%;
  object-fit:cover;background:rgba(255,255,255,.06)}
.mrow .bar{height:clamp(15px,2.5vh,26px)}
.mrow:first-child .fill{background:linear-gradient(90deg,rgba(242,149,46,.8),#ffc477)}
.mrow .nm b{font-weight:700}
.mrow .nm i{font-style:normal;color:var(--dim2);font-size:.86em;margin-left:6px}

/* ---------------------------------------------------------- controls */
#topbar{position:fixed;top:0;left:0;right:0;z-index:38;display:flex;align-items:center;
  gap:clamp(10px,2vw,28px);padding:clamp(9px,1.5vh,15px) clamp(18px,3.2vw,54px);
  background:linear-gradient(180deg,rgba(7,9,16,.94),rgba(7,9,16,.72) 68%,transparent);
  backdrop-filter:blur(9px);pointer-events:none}
#topbar > *{pointer-events:auto}
#topbar .tb-l{flex:0 1 auto;min-width:0;font-size:clamp(10px,1.05vw,13px);letter-spacing:.18em;
  text-transform:uppercase;color:var(--dim2);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
#topbar .tb-l b{color:var(--acc);font-weight:700}
#topbar .tb-r{flex:1 1 auto;min-width:0;text-align:right;font-size:clamp(9px,.92vw,11.5px);
  color:var(--dim2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#topbar .tb-r a{color:var(--dim);text-decoration:none;border-bottom:1px solid var(--line)}
#topbar .tb-r a:hover{color:var(--acc)}
#tb-tabs{flex:0 0 auto;display:flex;gap:5px}
#tb-tabs button{padding:5px 15px;border-radius:999px;border:1px solid var(--line);
  font-size:clamp(9.5px,.95vw,11.5px);letter-spacing:.13em;text-transform:uppercase;
  color:var(--dim);background:rgba(12,16,26,.6);transition:.18s}
#tb-tabs button:hover{color:var(--ink);border-color:var(--dim2)}
#tb-tabs button.on{color:#140b02;background:var(--acc);border-color:var(--acc);font-weight:700}

#jq{width:100%;margin:14px 0 4px;padding:11px 14px;border-radius:12px;
  border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--ink);
  font-size:15px;outline:none}
#jq:focus{border-color:var(--acc)}
#jlist{max-height:58dvh;overflow-y:auto;margin-top:10px;
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 16px;align-content:start}
.jrow{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:9px;align-items:center;
  padding:6px 9px;border-radius:9px;cursor:pointer;font-size:12.5px;border:1px solid transparent;
  min-width:0}
.jrow > span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(max-width:640px){#jlist{grid-template-columns:1fr}}
.jrow:hover,.jrow.sel{background:var(--panel);border-color:var(--line)}
.jrow .jn{color:var(--dim2);font-variant-numeric:tabular-nums;text-align:right}
.jrow .jt{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim2)}
.jrow b{font-weight:400}
.jrow.sel .jn{color:var(--acc)}

#bar{position:fixed;left:50%;bottom:max(12px,env(safe-area-inset-bottom));
  transform:translateX(-50%);z-index:40;display:flex;align-items:center;gap:4px;
  background:rgba(12,16,26,.82);backdrop-filter:blur(16px);border:1px solid var(--line);
  border-radius:999px;padding:5px 7px}
#bar button:not(#count){width:34px;height:34px;border-radius:50%;display:grid;place-items:center;
  color:var(--dim);transition:.18s}
#bar button:not(#count):hover{background:rgba(255,255,255,.09);color:var(--ink)}
#bar svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round}
#count{font-size:11px;letter-spacing:.1em;color:var(--dim);padding:5px 11px;
  font-variant-numeric:tabular-nums;white-space:nowrap;border-radius:999px;
  border:1px solid transparent;transition:.18s}
#count:hover{border-color:var(--line);background:rgba(255,255,255,.06);color:var(--ink)}
#count b{color:var(--ink);font-weight:700}

/* ------------------------------------------------------------- modal */
.modal{position:fixed;inset:0;z-index:60;background:rgba(4,6,12,.82);
  backdrop-filter:blur(10px);display:none;place-items:center;padding:4vw}
.modal.on{display:grid}
.mbox{position:relative;width:min(880px,94vw);max-height:92dvh;overflow-y:auto;
  background:linear-gradient(160deg,#111827,#0a0e18);border:1px solid var(--line);
  border-radius:var(--r);padding:clamp(14px,2vw,26px)}
#emodal .mbox{overflow:hidden}
.marrow{position:absolute;top:50%;transform:translateY(-50%);z-index:3;
  width:32px;height:62px;display:grid;place-items:center;border-radius:12px;
  background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--dim);
  transition:.18s}
.marrow:hover{background:rgba(242,149,46,.16);border-color:rgba(242,149,46,.5);
  color:var(--acc)}
.marrow[disabled]{opacity:.22;pointer-events:none}
.marrow.l{left:6px} .marrow.r{right:6px}
.marrow svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round}
#emodal .mbox{padding-left:44px;padding-right:44px}
.mplayer{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--acc);
  font-weight:700;margin-bottom:3px}
.mpager{font-size:10.5px;letter-spacing:.1em;color:var(--dim2);margin-top:9px;
  text-align:center;font-variant-numeric:tabular-nums}
@media(max-width:640px){
  #emodal .mbox{padding-left:14px;padding-right:14px}
  .marrow{top:auto;bottom:8px;transform:none;width:44px;height:34px}
  .mgrid{grid-template-columns:repeat(3,1fr)}
}
.mbox h3{font-size:clamp(16px,2vw,26px);font-weight:700;letter-spacing:-.02em;margin-bottom:4px}
.mbox h5{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--acc);
  font-weight:700;margin:12px 0 5px}
.mbox p,.mbox li{font-size:13px;line-height:1.6;color:var(--dim)}
.mbox ul{padding-left:17px}
.mbox a{color:var(--acc);text-decoration:none}
.mclose{position:sticky;top:0;float:right;font-size:24px;line-height:1;color:var(--dim)}
.mgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:11px 0 4px}
.mgrid > div{background:var(--panel);border:1px solid var(--line);border-radius:11px;
  padding:7px 10px;min-width:0}
.mgrid .k{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim2);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mgrid .v{font-size:clamp(15px,1.6vw,20px);font-weight:700;margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrounds{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.mrounds span{background:var(--panel);border:1px solid var(--line);border-radius:9px;
  padding:6px 12px;font-variant-numeric:tabular-nums;font-size:13px}
.mrounds span i{display:block;font-style:normal;font-size:9px;color:var(--dim2);
  letter-spacing:.12em}

/* ---- hole-by-hole scorecard ---- */
.scwrap{margin-top:4px;overflow-x:auto;padding-bottom:2px}
.sc{margin-top:9px;min-width:566px}
.scr{display:flex;align-items:baseline;gap:9px;margin-bottom:4px;
  font-size:11.5px;color:var(--dim)}
.scr b{color:var(--ink);font-size:13px;font-weight:700}
.scr em{font-style:normal;color:var(--acc);font-weight:700}
.scg{display:grid;grid-template-columns:30px repeat(9,1fr) 33px repeat(9,1fr) 33px 37px;
  gap:2px;align-items:center}
.scg.wide{grid-template-columns:84px repeat(9,1fr) 33px repeat(9,1fr) 33px 37px;
  row-gap:3px}
.scg .rlab{text-align:left;font-size:9px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--dim2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scg.wide .rlab{font-size:11px;letter-spacing:0;text-transform:none;color:var(--dim)}
.scg.wide .rlab b{color:var(--ink);font-weight:700;margin-right:5px}
.scg.wide .rlab i{font-style:normal;color:var(--acc);font-weight:700}
.scg.wide .lab{padding-bottom:1px}
.scg > div{text-align:center;font-size:10.5px;padding:0;font-variant-numeric:tabular-nums}
.scg .lab{text-align:left;font-size:9px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--dim2)}
.scg .hn{color:var(--dim2);font-size:9.5px}
.scg .pr{color:var(--dim);font-size:10px}
.scg .sub{font-weight:700;color:var(--dim);background:rgba(255,255,255,.04);border-radius:5px}
.scg .tot{font-weight:700;color:var(--ink);background:rgba(255,255,255,.07);border-radius:5px}
.sq{display:inline-grid;place-items:center;width:19px;height:19px;font-weight:700;
  font-size:11px;line-height:1}
.sq.eagle{background:var(--acc);color:#160c02;border-radius:50%;
  box-shadow:0 0 0 2px rgba(242,149,46,.35)}

  .boxgrid.four{grid-template-columns:repeat(2,1fr);row-gap:11px}

  .lb{max-height:56vh;overflow:hidden}

  .stgrid{grid-template-columns:1fr;row-gap:6px}
  .sgrow{grid-template-columns:96px 1fr 52px 38px}

  .evhead{display:none}
  .ev{grid-template-columns:52px minmax(0,1fr) auto auto auto auto;
    grid-template-areas:"d n n n n p" "r r tt tp pt mo";

  .ev .d{grid-area:d}

  .ev .tt{grid-area:tt}
  .ev .tp{grid-area:tp}
  .ev .pt{grid-area:pt}

  .ev .pt::after{content:" pts";font-size:.82em;letter-spacing:.04em}
  .ev .pt:empty::after,.ev .pt[data-none]::after{content:""}
  .ev{flex:0 0 auto;max-height:none;padding:5px 7px;line-height:1.25}
  .lbrow{height:auto;padding:5px 7px;line-height:1.25}

    grid-template-columns:30px minmax(0,1fr) 62px 38px 24px;gap:4px}
  .lbrow .hs .sq{width:17px;height:17px;font-size:9.5px}

  /* the aligned card is a landscape idea: at 375px those 21 columns leave 12px a
     hole. On a phone the row opens the modal instead, so hide the extra track. */
  .hgrid{grid-template-columns:30px repeat(18,minmax(0,1fr));gap:1px}
  .hgrid .hrlab{font-size:7px;letter-spacing:.02em;overflow:hidden}
  .hhead.sum,.hsum,.scgap,.sclab,.hrlab.sc,.scell{display:none}
  /* the inline event panel is a landscape idea too - the modal covers it here */
  .pevent{display:none!important}
  .pstats{display:flex!important}
  .rrow{flex:0 0 auto}
  .rrow .bar{height:22px}
  .dcols,.mcols,.hcols{grid-template-columns:1fr;grid-auto-flow:row;grid-template-rows:none}
  .hcols{gap:3px}
  .hrow{min-height:22px}
  .mcols{gap:3px}
  .mrow{min-height:26px}
  .drow{grid-template-columns:26px 1fr 62px 62px 48px}
  .tlogo{height:clamp(44px,11vw,70px)}
  .thead{flex-wrap:wrap}
  .twin{max-width:none;flex:1 1 100%;padding-left:0;border-left:0;
    border-top:1px solid var(--line);padding-top:9px;justify-content:flex-start}

  .t-bg img{opacity:.3}
  .t-bg::after{background:linear-gradient(180deg,rgba(7,9,16,.7),rgba(7,9,16,.95) 45%)}
}

@media(max-width:560px){
  .boxgrid.six,.boxgrid.seven{grid-template-columns:repeat(2,1fr)}
}

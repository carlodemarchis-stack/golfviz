<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PGA TOUR 2026 — Season Film</title>
<meta name="description" content="Every player of the 2026 FedExCup top 70 and all 37 tournaments of the season, as an interactive card film. Produced with passion by A guy with a scarf (Carlo De Marchis).">
<link rel="canonical" href="https://golf.aguywithascarf.com/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="A guy with a scarf">
<meta property="og:title" content="PGA TOUR 2026 — Season Film">
<meta property="og:description" content="An interactive golf experience: the FedExCup top 70 and all 37 tournaments of the 2026 season. Best experienced in landscape on laptops & iPads — but also great on your smartphone in portrait.">
<meta property="og:url" content="https://golf.aguywithascarf.com/">
<meta property="og:image" content="https://golf.aguywithascarf.com/img/og.png?v=1">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="PGA TOUR 2026 — Season Film">
<meta name="twitter:description" content="An interactive golf experience: the FedExCup top 70 and all 37 tournaments of the 2026 season.">
<meta name="twitter:image" content="https://golf.aguywithascarf.com/img/og.png?v=1">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
:root{
  --bg:#070910; --panel:rgba(255,255,255,.055); --panel2:rgba(255,255,255,.014);
  --line:rgba(150,166,205,.14); --ink:#eef2fb; --dim:#93a0bd; --dim2:#66718c;
  --acc:#f2952e; --acc2:#7c5cff;
  --major:#f2952e; --playoff:#e8534e; --signature:#7c5cff; --players:#3fbe72;
  --full:#4a86e8; --opposite:#66718c;
  --r:20px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-weight:300;
  -webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
[hidden]{display:none!important}   /* author display rules otherwise beat the hidden attribute */

/* ---------------------------------------------------------------- film */
#film{position:fixed;inset:0;display:flex;transition:transform .55s cubic-bezier(.16,.84,.34,1);
  will-change:transform}
.card{flex:0 0 100vw;width:100vw;height:100dvh;position:relative;overflow:hidden}
.inner{position:absolute;inset:0;padding:clamp(18px,3.2vw,54px);
  padding-top:clamp(50px,7.5vh,78px);
  padding-bottom:clamp(76px,9.5vh,104px);display:flex;gap:clamp(16px,2.4vw,40px)}

/* ------------------------------------------------------------- player */
/* top bar = card chrome (experience + credit), never player data */
.pl-inner{flex-direction:column;gap:0}
.pbody{flex:1 1 auto;min-height:0;display:flex;gap:clamp(16px,2.6vw,44px)}
.pcol{flex:0 0 43%;min-width:0;display:flex;flex-direction:column;
  gap:clamp(9px,1.5vh,18px);justify-content:flex-start}

/* left top: photo, with personal info + all-time record beside it */
.ptop{flex:0 0 auto;display:flex;gap:clamp(12px,1.8vw,26px);
  align-items:stretch;min-width:0}
.pphoto{flex:0 0 clamp(128px,14.2vw,216px);height:auto;aspect-ratio:7/9;
  position:relative;border-radius:var(--r);
  overflow:hidden;background:linear-gradient(160deg,var(--panel),var(--panel2));
  border:1px solid var(--line)}
.pphoto::after{content:"";position:absolute;inset:0;z-index:0;
  background:radial-gradient(120% 80% at 50% 108%,rgba(242,149,46,.22),transparent 62%)}
.phrank{position:absolute;left:0;right:0;top:-1.5%;z-index:1;text-align:center;
  font-size:clamp(96px,12.5vw,190px);font-weight:700;line-height:.78;letter-spacing:-.05em;
  color:rgba(186,199,226,.17);pointer-events:none}
.pphoto img{position:absolute;left:50%;bottom:0;transform:translateX(-50%);
  height:88%;width:auto;object-fit:contain;object-position:bottom;z-index:2;
  filter:drop-shadow(0 14px 32px rgba(0,0,0,.55))}
.pinfo{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;
  justify-content:center;gap:clamp(5px,1vh,12px)}
.pinfo > *{flex:0 0 auto}
/* full-width stat boxes below the photo block */
.pbox{flex:0 0 auto;background:linear-gradient(160deg,var(--panel),var(--panel2));
  border:1px solid var(--line);border-radius:16px;
  padding:clamp(8px,1.15vh,15px) clamp(11px,1.2vw,18px)}
.boxlegend{font-size:clamp(8.5px,.82vw,10.5px);letter-spacing:.2em;text-transform:uppercase;
  color:var(--dim2);font-weight:700;margin-bottom:clamp(5px,.85vh,10px)}
.boxgrid{display:grid;gap:clamp(6px,1vw,16px)}
.boxgrid.four{grid-template-columns:repeat(4,1fr)}
.boxgrid.six{grid-template-columns:repeat(6,1fr)}
.boxgrid.seven{grid-template-columns:repeat(7,1fr)}
.pbox.mix{padding-bottom:0;overflow:hidden}
.pmix{display:flex;height:clamp(7px,1.05vh,11px);overflow:hidden;
  margin:clamp(8px,1.1vh,14px) calc(-1 * clamp(12px,1.35vw,20px)) 0}
.pmix i{display:block;height:100%}
.cell{min-width:0}
.cell b{display:block;font-size:clamp(12px,1.13vw,17.5px);font-weight:700;line-height:1;
  letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell i{display:block;font-style:normal;font-size:clamp(8.5px,.8vw,10.5px);
  letter-spacing:.12em;text-transform:uppercase;color:var(--dim2);margin-top:5px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell.hero b{color:var(--acc)}
.cell.world b{color:var(--acc2)}
.cell b small{font-size:.55em;font-weight:300;color:var(--dim);letter-spacing:0}
.cell b em{font-style:normal;font-size:.42em;font-weight:400;color:var(--dim2);
  letter-spacing:0;margin-left:.3em}

.pres{flex:1 1 57%;min-width:0;display:flex;flex-direction:column;
  gap:clamp(8px,1.3vh,16px)}

.crumb{display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  font-size:clamp(10px,1.05vw,13px);letter-spacing:.16em;text-transform:uppercase;color:var(--dim2)}
.crumb b{color:var(--acc);font-weight:700}
.fl{height:.95em;width:auto;vertical-align:-.08em;margin-right:6px;border-radius:2px;
  box-shadow:0 0 0 1px rgba(255,255,255,.12)}
.pname{font-weight:700;letter-spacing:-.03em;line-height:.96;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.psub{display:flex;gap:clamp(10px,1.6vw,26px);flex-wrap:wrap;align-items:baseline;
  font-size:clamp(11px,1.15vw,14px);color:var(--dim)}
.psub b{color:var(--ink);font-weight:400}


.tabs{display:flex;gap:6px}
.tab{padding:6px 14px;border-radius:999px;border:1px solid var(--line);
  font-size:clamp(10px,1vw,12px);letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.tab.on{background:var(--acc);color:#140b02;border-color:var(--acc);font-weight:700}

.pane{flex:1 1 auto;min-height:0;overflow:hidden;position:relative}
.evlist{height:100%;display:flex;flex-direction:column;gap:1px;overflow:hidden}
.ev,.evhead{display:grid;
  grid-template-columns:58px minmax(0,1fr) 46px 92px 44px 46px 52px 62px;
  gap:8px;align-items:center;padding:0 9px}
.ev{border-radius:9px;font-size:clamp(9.5px,.98vw,13px);
  cursor:pointer;border:1px solid transparent;line-height:1;overflow:hidden;
  flex:1 1 0;min-height:0;max-height:30px}
.evhead{flex:0 0 auto;color:var(--dim2);font-size:clamp(8.5px,.82vw,10.5px);
  letter-spacing:.13em;text-transform:uppercase;padding-bottom:6px;margin-bottom:3px;
  border-bottom:1px solid var(--line)}
.evhead .r,.evhead .tt,.evhead .tp,.evhead .pt,.evhead .mo{text-align:right}
.ev .tt,.ev .tp{text-align:right;font-variant-numeric:tabular-nums;color:var(--dim)}
.ev .mo{text-align:right;font-variant-numeric:tabular-nums;color:var(--dim);
  overflow:hidden;text-overflow:ellipsis}
.ev.win .tt,.ev.win .tp,.ev.win .mo{color:var(--ink)}
.ev:hover{background:var(--panel);border-color:var(--line)}
.ev .d{color:var(--dim2);font-size:.88em;font-variant-numeric:tabular-nums}
.ev .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev .p{font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.ev .r{color:var(--dim);font-variant-numeric:tabular-nums;letter-spacing:.06em;
  text-align:right;font-size:.92em}
.ev .pt{text-align:right;color:var(--acc);font-variant-numeric:tabular-nums;font-size:.95em}
.ev.cut .pt,.ev.cut .tt,.ev.cut .tp,.ev.cut .mo{color:var(--dim2)}
.ev.win{background:linear-gradient(90deg,rgba(242,149,46,.20),rgba(242,149,46,.03));
  border-color:rgba(242,149,46,.34)}
.ev.win .n{font-weight:700}
.ev.top10 .p{color:var(--acc)}
.ev.cut .p,.ev.cut .n{color:var(--dim2)}

.statpane{height:100%;overflow:hidden;display:flex;flex-direction:column;
  gap:clamp(6px,1vh,12px)}
.sgblock{flex:0 0 auto}
.sglab{font-size:clamp(8.5px,.82vw,10.5px);letter-spacing:.18em;text-transform:uppercase;
  color:var(--dim2);font-weight:700;margin-bottom:clamp(4px,.8vh,9px)}
.sgrow{display:grid;grid-template-columns:118px 1fr 56px 42px;gap:9px;align-items:center;
  font-size:clamp(9.5px,.95vw,12px);margin-bottom:clamp(3px,.55vh,7px)}
.sgrow .t{color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sgrow.tot .t{color:var(--ink);font-weight:700}
.sgaxis{position:relative;height:clamp(11px,1.8vh,18px);background:rgba(255,255,255,.03);
  border-radius:4px}
.sgaxis::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;
  background:rgba(150,166,205,.35)}
.sgfill{position:absolute;top:2px;bottom:2px;border-radius:3px}
.sgfill.pos{background:linear-gradient(90deg,rgba(63,224,138,.55),#3fe08a)}
.sgfill.neg{background:linear-gradient(90deg,#e8534e,rgba(232,83,78,.55))}
.sgrow .v{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.sgrow .rk{text-align:right;font-variant-numeric:tabular-nums;color:var(--dim2);
  font-size:.88em}
.sgrow .rk b{color:var(--acc);font-weight:700}
.stgrid{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:repeat(2,1fr);
  gap:0 clamp(14px,2.2vw,34px);align-content:start}
.stcol{display:flex;flex-direction:column;gap:clamp(2px,.45vh,6px);min-width:0}
.sgnote{flex:0 0 auto;margin-top:clamp(8px,1.4vh,18px);padding-top:clamp(7px,1.1vh,13px);
  border-top:1px solid var(--line);font-size:clamp(9px,.9vw,11.5px);line-height:1.5;
  color:var(--dim2);max-width:70ch}
.sgnote b{color:#3fe08a;font-weight:700}
.stgrp{font-size:clamp(8px,.78vw,10px);letter-spacing:.16em;text-transform:uppercase;
  color:var(--acc);font-weight:700;margin-top:clamp(4px,.8vh,10px)}
.stcol > .stgrp:first-child{margin-top:0}
.strow{display:grid;grid-template-columns:1fr 62px 40px;gap:8px;align-items:center;
  font-size:clamp(9px,.92vw,11.5px);min-height:0}
.strow .t{color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.strow .v{text-align:right;font-variant-numeric:tabular-nums}
.strow .rk{text-align:right;font-variant-numeric:tabular-nums;color:var(--dim2);font-size:.88em}
.strow .rk b{color:var(--acc);font-weight:700}

.story{height:100%;overflow-y:auto;padding-right:8px;display:flex;flex-direction:column;
  gap:clamp(9px,1.3vh,16px);scrollbar-width:thin}
.story h4{font-size:clamp(11px,1.1vw,14px);font-weight:700;color:var(--acc);
  letter-spacing:.04em;margin-bottom:3px}
.story p{font-size:clamp(11px,1.05vw,13.5px);line-height:1.55;color:var(--dim)}
.story .none{color:var(--dim2);font-style:italic}

/* --------------------------------------------------------- tournament */
.t-bg{position:absolute;inset:0;z-index:0}
.t-bg img{width:100%;height:100%;object-fit:cover;opacity:.42}
.t-bg::after{content:"";position:absolute;inset:0;
  background:linear-gradient(100deg,rgba(7,9,16,.97) 30%,rgba(7,9,16,.62) 62%,rgba(7,9,16,.42))}
.t-bg.nophoto{background:
  radial-gradient(90% 120% at 88% 10%,rgba(242,149,46,.16),transparent 60%),
  linear-gradient(140deg,#0d1420,#070910 60%)}
.t-inner{z-index:1}
.t-left{flex:1 1 52%;min-width:0;display:flex;flex-direction:column;gap:clamp(9px,1.4vh,18px)}
.t-right{flex:1 1 46%;min-width:0;display:flex;flex-direction:column;gap:clamp(8px,1.2vh,14px)}
.thead{display:flex;align-items:center;gap:clamp(12px,1.6vw,22px);min-width:0}
.tlogo{height:clamp(52px,8.4vh,104px);width:auto;flex:0 0 auto;object-fit:contain;
  filter:drop-shadow(0 6px 18px rgba(0,0,0,.6))}
.tname{flex:1 1 auto;min-width:0;font-weight:700;letter-spacing:-.028em;line-height:1.05}
.twin{flex:0 0 auto;display:flex;align-items:center;gap:clamp(8px,1vw,14px);
  padding-left:clamp(10px,1.4vw,20px);border-left:1px solid var(--line);max-width:46%}
.twin img{width:clamp(34px,4vw,54px);height:clamp(34px,4vw,54px);border-radius:50%;
  object-fit:cover;background:rgba(255,255,255,.05);flex:0 0 auto}
.tw-t{min-width:0;display:flex;flex-direction:column;align-items:flex-end;text-align:right}
.tw-t .lbl{font-size:clamp(8.5px,.8vw,10.5px);letter-spacing:.18em;text-transform:uppercase;
  color:var(--acc);font-weight:700}
.tw-t .nm{color:var(--ink);font-weight:700;letter-spacing:-.02em;line-height:1.14;
  margin:1px 0 2px;max-width:100%;overflow-wrap:anywhere}
.tw-t .cd{font-size:clamp(9px,.92vw,11.5px);color:var(--dim);max-width:100%;
  overflow-wrap:anywhere}
.tmeta{display:flex;gap:clamp(9px,1.5vw,22px);flex-wrap:wrap;
  font-size:clamp(10px,1.08vw,13.5px);color:var(--dim)}
.tmeta b{color:var(--ink);font-weight:400}
.badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:clamp(9px,.9vw,11px);
  letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:#0a0d14}
/* ---- per-hole field scoring, below the tournament's info ---- */
.hpanel{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;
  gap:clamp(6px,1vh,12px);margin-top:clamp(8px,1.4vh,18px);
  padding-top:clamp(8px,1.3vh,16px);border-top:1px solid var(--line);max-width:760px}
.hptop{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hpills{display:flex;gap:4px}
.hpills button{padding:3px 10px;border-radius:999px;border:1px solid var(--line);
  font-size:clamp(8.5px,.82vw,10.5px);letter-spacing:.1em;text-transform:uppercase;
  color:var(--dim);background:rgba(12,16,26,.5)}
.hpills button.on{background:var(--acc);color:#140b02;border-color:var(--acc);font-weight:700}
.hcourse{font-size:clamp(9px,.88vw,11px);color:var(--dim2);letter-spacing:.06em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.hkpis{display:flex;gap:clamp(10px,1.8vw,26px);flex-wrap:wrap;
  font-size:clamp(9px,.88vw,11.5px);color:var(--dim2)}
.hkpis b{color:var(--ink);font-weight:700}
.hkpis .hard{color:#e8534e}.hkpis .easy{color:#3fe08a}
.hgrid{flex:0 0 auto;display:grid;grid-template-columns:30px repeat(18,minmax(0,1fr));
  gap:2px;align-content:start}
.hgrid > div{min-width:0}
.hhead{text-align:center;line-height:1.1;padding-bottom:2px}
.hhead .hn{display:block;font-size:clamp(8.5px,.8vw,11px);font-weight:700;color:var(--dim)}
.hhead .hp{display:block;font-size:clamp(7px,.64vw,9px);color:var(--dim2)}
.hrlab{display:flex;align-items:center;font-size:clamp(7.5px,.72vw,9.5px);
  letter-spacing:.1em;color:var(--dim2);font-weight:700}
.hrlab.all{color:var(--acc)}
.hgrid .gap{grid-column:1 / -1;height:clamp(4px,.7vh,9px)}
.hcell{border-radius:5px;text-align:center;cursor:pointer;border:1px solid transparent;
  display:flex;align-items:center;justify-content:center;
  font-size:clamp(7.5px,.73vw,9.5px);font-variant-numeric:tabular-nums;
  color:rgba(255,255,255,.72);min-height:clamp(15px,2.5vh,26px)}
.hcell.na{background:none;cursor:default;color:transparent}
.hcell.sel{border-color:var(--acc);box-shadow:0 0 0 1px rgba(242,149,46,.55);
  color:var(--ink);font-weight:700}
.d2{background:rgba(232,83,78,.42)}.d1{background:rgba(232,83,78,.20)}
.d0{background:rgba(150,166,205,.13)}
.e1{background:rgba(63,224,138,.20)}.e2{background:rgba(63,224,138,.40)}
.hbox{flex:0 1 auto;min-height:0;display:flex;flex-direction:column;
  background:linear-gradient(140deg,var(--panel),var(--panel2));border:1px solid var(--line);
  border-radius:14px;padding:clamp(8px,1.2vh,14px) clamp(10px,1.2vw,16px)}
.hdet{flex:0 0 auto;display:grid;grid-template-columns:auto 1fr;gap:clamp(8px,1.4vw,20px);
  align-items:center}
.hdet .lead{font-size:clamp(10px,1vw,13px);color:var(--dim);white-space:nowrap}
.hdet .lead b{color:var(--ink);font-size:clamp(13px,1.35vw,18px);font-weight:700}
.hdet .lead i{font-style:normal;color:var(--acc);font-weight:700}
.hmix{display:flex;height:clamp(11px,1.7vh,17px);border-radius:5px;overflow:hidden}
.hmix i{display:block;height:100%}
.hcounts{display:flex;gap:clamp(7px,1.2vw,16px);flex-wrap:wrap;margin-top:5px;
  font-size:clamp(8.5px,.8vw,10.5px);color:var(--dim2)}
.hcounts span b{color:var(--ink);font-weight:700;margin-right:3px}
.hwho{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;
  margin-top:clamp(7px,1.1vh,13px);padding-top:clamp(7px,1.1vh,13px);
  border-top:1px solid var(--line)}
.hwho:only-child{margin-top:0;padding-top:0;border-top:0}
.hwho .lbl{font-size:clamp(8px,.76vw,10px);letter-spacing:.16em;text-transform:uppercase;
  color:var(--dim2);font-weight:700;margin-bottom:clamp(4px,.7vh,8px)}
.hwcols{flex:1 1 auto;min-height:0;display:grid;gap:clamp(6px,1vw,14px)}
.hwcol{min-width:0;min-height:0;display:flex;flex-direction:column}
.hwhead{font-size:clamp(8.5px,.8vw,10.5px);font-weight:700;padding-bottom:3px;
  margin-bottom:4px;border-bottom:1px solid var(--line);display:flex;
  justify-content:space-between;gap:6px}
.hwhead span:last-child{color:var(--dim2);font-weight:400}
.hwcol ul{list-style:none;flex:1 1 auto;min-height:0;overflow:hidden;
  column-width:clamp(58px,6vw,84px);column-gap:clamp(6px,.9vw,14px)}
.hwcol li{break-inside:avoid}
.hwcol li{font-size:clamp(8.5px,.82vw,11px);color:var(--dim);overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.hwnote{font-size:clamp(9px,.86vw,11px);color:var(--dim2);font-style:italic}



.lb{flex:1 1 auto;min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:1px}
.lbhead,.lbrow{display:grid;grid-template-columns:42px 1fr 116px 52px;gap:8px;align-items:center;
  padding:0 10px;font-size:clamp(9.5px,.98vw,12.5px)}
.lbrow{flex:1 1 0;min-height:0;max-height:28px;line-height:1;overflow:hidden}
.lbhead{color:var(--dim2);font-size:clamp(9px,.85vw,11px);letter-spacing:.13em;
  text-transform:uppercase;border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:3px}
.lbrow{border-radius:8px}
.lbrow:nth-child(even){background:rgba(255,255,255,.022)}
.lbrow.w{background:linear-gradient(90deg,rgba(242,149,46,.20),rgba(242,149,46,.02));
  font-weight:700}
.lbrow .pos{color:var(--dim);font-variant-numeric:tabular-nums}
.lbrow.w .pos{color:var(--acc)}
.lbrow .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lbrow .rd{color:var(--dim2);font-variant-numeric:tabular-nums;letter-spacing:.08em;
  text-align:right;font-size:.92em}
.lbrow .tot{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}

/* -------------------------------------------------------------- chart */
.chartwrap{flex:1 1 100%;min-width:0;display:flex;flex-direction:column;
  gap:clamp(8px,1.4vh,18px)}

/* share of holes, shown small and grey beside the count */
const share = (n, holes) => holes
  ? `<em>${(n / holes * 100).toFixed(n / holes < 0.02 ? 1 : 0)}%</em>` : "";
const abbrMoney = s => {
  const n = cash(s);
  if (!n) return "—";
  return n >= 1e6 ? "$" + (n / 1e6).toFixed(1) + "M" : "$" + Math.round(n / 1e3) + "K";
};
const pts = n => (+n).toLocaleString("en-US", {maximumFractionDigits: 0});
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const shortDate = d => {                       // the TOUR sends "1.25.2026"
  const p = String(d || "").split(".");
  return p.length >= 2 && MON[+p[0] - 1] ? `${MON[+p[0] - 1]} ${+p[1]}` : (d || "");
};
const flag = c => c ? `<img class="fl" src="https://flagcdn.com/24x18/${iso(c)}.png" alt="">` : "";
/* PGA uses IOC-ish 3-letter codes incl. UK home nations; flagcdn wants 2-letter (+gb-eng etc.) */
const ISO = {USA:"us",ENG:"gb-eng",SCO:"gb-sct",NIR:"gb-nir",WAL:"gb-wls",IRL:"ie",RSA:"za",
  AUS:"au",CAN:"ca",JPN:"jp",KOR:"kr",NOR:"no",SWE:"se",DEN:"dk",ESP:"es",GER:"de",FRA:"fr",
  ITA:"it",AUT:"at",BEL:"be",NED:"nl",FIN:"fi",COL:"co",ARG:"ar",CHI:"cl",VEN:"ve",MEX:"mx",
  NZL:"nz",TPE:"tw",CHN:"cn",IND:"in",THA:"th",PHI:"ph",ZIM:"zw",PAR:"py",PUR:"pr",BRA:"br"};
const iso = c => ISO[c] || (c || "").slice(0, 2).toLowerCase();

const CAT = {major:["Major","--major"], playoff:["Playoff","--playoff"],
  signature:["Signature","--signature"], players:["The Players","--players"],
  full:["Full field","--full"], opposite:["Opposite field","--opposite"]};

/* three different Kims in this top 70 - only add an initial where it is needed */
const SURNAME_DUPES = (() => {
  const c = {};
  P.forEach(p => { const l = p.last || p.name.split(" ").slice(-1)[0]; c[l] = (c[l] || 0) + 1; });
  return c;
})();
const shortName = p => {
  const l = p.last || p.name.split(" ").slice(-1)[0];
  return SURNAME_DUPES[l] > 1 && p.first ? `${p.first[0]}. ${l}` : l;
};

const CARDS = [];
P.forEach((p, i) => CARDS.push({kind: "player", d: p, i}));
T.forEach((t, i) => CARDS.push({kind: "tournament", d: t, i}));
CARDS.push({kind: "race"}, {kind: "money"}, {kind: "holes"}, {kind: "diverge"});
const SEC = [0, P.length, P.length + T.length];

/* -------------------------------------------------------- player card */
function playerCard(p) {
  const nameSize = Math.min(40, 400 / Math.max(9, p.name.length));
  const ow = p.owgr;
  const c = p.career || {};
  const sc = p.scoring || {};
  const evs = p.events;                      // already chronological, Jan -> Aug
  return `<div class="card" data-k="player">
    <div class="inner pl-inner">
      <div class="pbody">
        <div class="pcol">

          <div class="ptop">
            <div class="pphoto"><div class="phrank">${String(p.rank).padStart(2, "0")}</div><img src="img/full/${p.id}.webp" alt="${esc(p.name)}" loading="lazy"></div>
            <div class="pinfo">
              <div class="pname" style="font-size:clamp(20px,${nameSize / 13}vw,${nameSize}px)">${esc(p.name)}</div>
              <div class="crumb"><span>${flag(p.flag)}${esc(p.country)}</span></div>
              <div class="psub">
                <span>Age <b>${esc(p.bio.age || "—")}</b></span>
                <span>Turned pro <b>${esc(p.bio.turnedPro || "—")}</b></span>
                ${c.tourCard ? `<span>TOUR card <b>${esc(c.tourCard)}</b></span>` : ""}
              </div>
              ${p.bio.college ? `<div class="psub"><span>College <b>${esc(p.bio.college)}</b></span></div>` : ""}
              ${p.bio.birthplace ? `<div class="psub"><span>Born <b>${esc(p.bio.birthplace)}</b></span></div>` : ""}
            </div>
          </div>

          <div class="pbox">
            <div class="boxlegend">2026 Rankings</div>
            <div class="boxgrid four">
              <div class="cell hero"><b>${p.rank}</b><i>FedExCup</i></div>
              <div class="cell"><b>${pts(p.points)}</b><i>Points</i></div>
              <div class="cell world"><b>${ow ? ow.rank : "—"}</b><i>World rank</i></div>
              <div class="cell"><b>${ow ? ow.avg : "—"}</b><i>World avg</i></div>
            </div>
          </div>

          <div class="pbox">
            <div class="boxlegend">2026 season</div>
            <div class="boxgrid six">
              <div class="cell"><b>${esc(p.season.events || evs.length)}</b><i>Events</i></div>
              <div class="cell"><b>${esc(p.season.cuts || "—")}</b><i>Cuts made</i></div>
              <div class="cell${p.season.wins > 0 ? " hero" : ""}"><b>${esc(p.season.wins || 0)}</b><i>Wins</i></div>
              <div class="cell"><b>${esc(p.season.top10 || 0)}</b><i>Top 10</i></div>
              <div class="cell"><b>${esc(p.season.top25 || 0)}</b><i>Top 25</i></div>
              <div class="cell"><b>${abbrMoney(p.season.money)}</b><i>Earnings</i></div>
            </div>
          </div>

          <div class="pbox mix">
            <div class="boxlegend">2026 Scoring</div>
            <div class="boxgrid seven">
              <div class="cell"><b>${pts(sc.holes || 0)}</b><i>Holes</i></div>
              <div class="cell"><b>${pts(sc.shots || 0)}</b><i>Shots</i></div>
              <div class="cell${sc.eagle ? " hero" : ""}"><b>${esc(sc.eagle || 0)}${share(sc.eagle, sc.holes)}</b><i>Eagles+</i></div>
              <div class="cell"><b>${pts(sc.birdie || 0)}${share(sc.birdie, sc.holes)}</b><i>Birdies</i></div>
              <div class="cell"><b>${pts(sc.par || 0)}${share(sc.par, sc.holes)}</b><i>Pars</i></div>
              <div class="cell"><b>${pts(sc.bogey || 0)}${share(sc.bogey, sc.holes)}</b><i>Bogeys</i></div>
              <div class="cell"><b>${esc(sc.dbl || 0)}${share(sc.dbl, sc.holes)}</b><i>Double+</i></div>
            </div>
            <div class="pmix" title="${["eagle","birdie","par","bogey","dbl"]
              .map(k => `${sc[k] || 0} ${k}`).join(" · ")}">
              ${["eagle", "birdie", "par", "bogey", "dbl"].map(k =>
                `<i class="s-${k}" style="width:${((sc[k] || 0) / (sc.holes || 1) * 100).toFixed(2)}%"></i>`
              ).join("")}
            </div>
          </div>

          <div class="pbox">
            <div class="boxlegend">All-time on TOUR</div>
            <div class="boxgrid six">
              <div class="cell"><b>${esc(c.events || "—")}</b><i>Events</i></div>
              <div class="cell"><b>${esc(c.cuts || "—")}</b><i>Cuts made</i></div>
              <div class="cell"><b>${esc(c.wins ?? p.bio.careerWins ?? "—")}</b><i>Wins</i></div>
              <div class="cell"><b>${esc(c.top10 || "—")}</b><i>Top 10</i></div>
              <div class="cell"><b>${esc(c.top25 || "—")}</b><i>Top 25</i></div>
              <div class="cell"><b>${abbrMoney(c.money)}</b><i>Earnings</i></div>
            </div>
          </div>
        </div>

        <div class="pres">
          <div class="tabs">
            <button class="tab on" data-tab="results">Results</button>
            <button class="tab" data-tab="majors">Majors</button>
            <button class="tab" data-tab="stats">Stats</button>
          </div>
          <div class="pane">
            <div class="evlist" data-pane="results">${EVHEAD}${evs.map(e => evRow(e, p)).join("")}</div>
            <div class="evlist" data-pane="majors" hidden>${EVHEAD}${majorRows(evs, p)}</div>
            <div class="statpane" data-pane="stats" hidden>${statsPane(p)}</div>
          </div>
        </div>
      </div>
    </div></div>`;
}

const SG_ROWS = [["total", "SG: Total"], ["ott", "Off the tee"], ["app", "Approach"],
                 ["arg", "Around the green"], ["putt", "Putting"]];
const SG_MAX = 2.6;   // strokes gained per round; nobody in this field exceeds it

function statsPane(p) {
  if (!p.sg) return `<p class="none">No 2026 stats published for this player.</p>`;
  const sgRow = ([k, label]) => {
    const d = p.sg[k], v = d.v;
    const w = Math.min(50, Math.abs(v) / SG_MAX * 50);
    const style = v >= 0 ? `left:50%;width:${w}%` : `right:50%;width:${w}%`;
    return `<div class="sgrow ${k === "total" ? "tot" : ""}">
      <span class="t">${label}</span>
      <div class="sgaxis"><div class="sgfill ${v >= 0 ? "pos" : "neg"}" style="${style}"></div></div>
      <span class="v" style="color:${v >= 0 ? "#3fe08a" : "#e8534e"}">${v >= 0 ? "+" : ""}${v.toFixed(3)}</span>
      <span class="rk">${d.r ? `<b>${d.r}</b>` : "—"}</span></div>`;
  };
  const grp = ([g, items]) => `<div class="stgrp">${esc(g)}</div>` +
    items.map(([t, v, r]) =>
      `<div class="strow"><span class="t">${esc(t)}</span>
        <span class="v">${esc(v)}</span>
        <span class="rk">${r ? `<b>${esc(r)}</b>` : "—"}</span></div>`).join("");
  const g = p.stats || [];
  return `<div class="sgblock">
      <div class="sglab">Strokes gained per round · TOUR rank</div>
      ${SG_ROWS.map(sgRow).join("")}
    </div>
    <div class="stgrid">
      <div class="stcol">${g.slice(0, 3).map(grp).join("")}</div>
      <div class="stcol">${g.slice(3).map(grp).join("")}</div>
    </div>
    <div class="sgnote">Strokes gained measures a player against the field: <b>+1.0</b> means a
      stroke a round better than the average player in the same events. The four parts add up to
      the total. The TOUR does not publish an around-the-green figure in this feed, so it is
      derived — total minus the other three — and has no rank.</div>`;
}

const MAJORS = ["Masters Tournament", "PGA Championship", "U.S. Open", "The Open Championship",
  "THE PLAYERS Championship"];

function posClass(e) {
  const pos = (e.pos || "").replace("T", "");
  if (e.pos === "1") return "win";
  if (/CUT|WD|DQ|MDF/i.test(e.pos || "")) return "cut";
  return +pos <= 10 ? "top10" : "";
}
function evRow(e, p) {
  return `<div class="ev ${posClass(e)}" data-ev="${esc(e.tid)}" data-pid="${p.id}">
    <span class="d">${esc(shortDate(e.date))}</span>
    <span class="n">${esc(e.name)}</span>
    <span class="p">${esc(e.pos || "—")}</span>
    <span class="r">${(e.rounds || []).filter(r => r && r !== "-").join(" ") || "—"}</span>
    <span class="tt">${esc(e.total || "—")}</span>
    <span class="tp">${esc(e.toPar || "—")}</span>
    <span class="pt"${e.pts ? "" : " data-none"}>${e.pts ? pts(e.pts) : "—"}</span>
    <span class="mo">${e.money && e.money !== "-" ? abbrMoney(e.money) : "—"}</span></div>`;
}

const EVHEAD = `<div class="evhead">
  <span>Date</span><span>Tournament</span><span>Pos</span><span class="r">Rounds</span>
  <span class="tt">Total</span><span class="tp">To par</span><span class="pt">Pts</span>
  <span class="mo">Money</span></div>`;
function majorRows(evs, p) {
  const m = evs.filter(e => MAJORS.includes(e.name));
  if (!m.length) return `<div class="story"><p class="none">No major or PLAYERS starts in 2026.</p></div>`;
  return m.map(e => evRow(e, p)).join("");
}
</script>
<script>
/* ---------------------------------------------------- tournament card */
const HAS_PHOTO = new Set(/*__PHOTOS__*/[]);

function tournamentCard(t) {
  const [label, varname] = CAT[t.category] || CAT.full;
  const photo = HAS_PHOTO.has(t.id);
  const ch = t.champion;
  const rows = t.leaderboard.slice(0, 22);
  const where = [t.city, t.state || (t.countryCode !== "USA" ? t.countryCode : "")]
    .filter(Boolean).join(", ");
  const nameMax = t.name.length > 34 ? 27 : t.name.length > 24 ? 33 : 40;
  const nameVw = (nameMax / 15).toFixed(2);
  const wLen = (ch.name || "").length;
  const winMax = wLen > 26 ? 13 : wLen > 18 ? 16 : 21;
  const faces = (ch.ids && ch.ids.length ? ch.ids : [ch.id]).filter(Boolean);
  return `<div class="card" data-k="tournament" data-tid="${t.id}">
    <div class="t-bg ${photo ? "" : "nophoto"}">
      ${photo ? `<img src="img/course/${t.id}.webp" alt="${esc(t.course || "")}" loading="lazy">` : ""}
    </div>
    <div class="inner t-inner">
      <div class="t-left">
        <div class="thead">
          <img class="tlogo" src="img/logo/${t.id}.png" alt="" loading="lazy">
          <div class="tname" style="font-size:clamp(17px,${nameVw}vw,${nameMax}px)">${esc(t.name)}</div>
          <div class="twin">
            ${faces.map(id => `<img src="img/face/${id}.webp" alt="" loading="lazy">`).join("")}
            <div class="tw-t">
              <span class="lbl">Won by</span>
              <span class="nm" style="font-size:clamp(12px,${(winMax / 14).toFixed(2)}vw,${winMax}px)">${esc(ch.name || "—")}</span>
              <span class="cd">${esc(ch.score || "")}${ch.strokes ? ` · ${ch.strokes} strokes` : ""}${ch.earnings ? ` · ${esc(ch.earnings)}` : ""}</span>
            </div>
          </div>
        </div>
        <div class="tmeta">
          <span class="badge" style="background:var(${varname})">${label}</span>
          <span><b>${esc(t.date)}</b> 2026</span>
          <span>${esc(t.course || "")}</span>
          ${where ? `<span>${esc(where)}</span>` : ""}
        </div>
        <div class="tmeta">
          <span>Purse <b>${esc(t.purse || "—")}</b></span>
          <span>Field <b>${t.field}</b></span>
          ${ch.points && ch.points !== "0" ? `<span>Winner's points <b>${esc(ch.points)}</b></span>` : ""}
          ${t.team ? `<span><b>Two-man teams</b></span>` : ""}
        </div>

        ${holePanel(t)}

      </div>
      <div class="t-right">
        <div class="lbhead"><span>Pos</span><span>${t.team ? "Team" : "Player"}</span>
          <span style="text-align:right">Rounds</span><span style="text-align:right">Total</span></div>
        <div class="lb">${rows.map((r, i) => `
          <div class="lbrow ${i === 0 ? "w" : ""}">
            <span class="pos">${esc(r.pos || "")}</span>
            <span class="nm">${esc(r.name)}${r.amateur ? " (a)" : ""}</span>
            <span class="rd">${(r.rounds || []).filter(Boolean).join(" ")}</span>
            <span class="tot">${esc(r.total || "")}</span>
          </div>`).join("")}</div>
      </div>
    </div></div>`;
}

/* ------------------------------ per-hole field scoring on a tournament */
/* hole row = [num, par, yards, avg, diffVsPar, eagles, birdies, pars, bogeys, doubles, rank] */
const diffClass = d => d >= .15 ? "d2" : d >= .05 ? "d1"
  : d <= -.25 ? "e2" : d <= -.05 ? "e1" : "d0";

/* "Torrey Pines Golf Course (South Course)" -> "South"; otherwise trim the filler */
const courseLabel = n => {
  const p = /\(([^)]+)\)/.exec(n || "");
  const base = p ? p[1] : n || "";
  return base.replace(/\s*(Golf Club|Golf Course|Golf Links|Country Club|Course)\s*$/i, "").trim()
    || base;
};

/* Scores on one hole from the players we hold cards for - the FedExCup top 70,
   not the whole field. At the rotating events a player's round may have been on
   another course, so the card's own course name has to match. */
function holeScorers(t, courseName, roundNum, hole) {
  const out = [];
  P.forEach(p => {
    const e = p.events.find(x => x.tid === t.id);
    if (!e || !e.card) return;
    e.card.forEach(r => {
      if (r.n !== roundNum) return;
      if (r.c && r.c !== courseName) return;      // played a different course that day
      const v = r.s[hole - 1];
      if (v) out.push({n: shortName(p), rank: p.rank, v});
    });
  });
  return out.sort((a, b) => a.v - b.v || a.rank - b.rank);
}

function scorerCols(t, c, rd, sel) {
  if (rd.r === "All")
    return `<div class="hwho"><div class="hwnote">Pick a round above to see which of the
      ranked players made what on this hole.</div></div>`;
  const rn = +rd.r.slice(1);
  const list = holeScorers(t, c.name, rn, sel[0]);
  if (!list.length)
    return `<div class="hwho"><div class="hwnote">None of the FedExCup top 70 played this
      course in round ${rn}.</div></div>`;
  const byScore = {};
  list.forEach(x => (byScore[x.v] = byScore[x.v] || []).push(x.n));
  const keys = Object.keys(byScore).map(Number).sort((a, b) => a - b);
  const NAMES = {"-3": "Albatross", "-2": "Eagle", "-1": "Birdie", "0": "Par",
                 "1": "Bogey", "2": "Double"};
  const cols = keys.map(k => {
    const d = k - sel[1];
    const label = NAMES[d] || (d > 0 ? `+${d}` : `${d}`);
    return `<div class="hwcol">
      <div class="hwhead"><span class="${SCLASS(d) === "par" ? "" : ""}"
        style="color:${d <= -2 ? "#3fe08a" : d === -1 ? "var(--acc)" : d === 0 ? "var(--ink)"
          : d === 1 ? "#8d9bbd" : "#e8534e"}">${k} · ${label}</span>
        <span>${byScore[k].length}</span></div>
      <ul>${byScore[k].map(n => `<li>${esc(n)}</li>`).join("")}</ul></div>`;
  }).join("");
  const weights = keys.map(k => Math.max(1, Math.ceil(byScore[k].length / 7)));
  return `<div class="hwho">
    <div class="lbl">Round ${rn} · ${list.length} of the FedExCup top 70 played this hole</div>
    <div class="hwcols" style="grid-template-columns:${
      weights.map(w => `minmax(0,${w}fr)`).join(" ")}">${cols}</div>
  </div>`;
}

function holePanel(t, ci = 0, ri = 0, hole = 0) {
  const cs = t.holes;
  if (!cs || !cs.length) return "";
  const c = cs[Math.min(ci, cs.length - 1)];
  /* the feed returns All, R4..R1 - read it chronologically instead */
  const rounds = c.rounds.slice().sort((a, b) =>
    a.r === "All" ? -1 : b.r === "All" ? 1 : (+a.r.slice(1)) - (+b.r.slice(1)));
  const rd = rounds[Math.min(ri, rounds.length - 1)];
  const byHole = r => { const m = {}; r.h.forEach(h => m[h[0]] = h); return m; };
  const nums = rounds[0].h.map(h => h[0]);
  const pars = byHole(rounds[0]);
  const sel = byHole(rd)[hole] || rd.h.reduce((a, b) => a[10] < b[10] ? a : b);
  const all = rounds.find(r => r.r === "All") || rounds[0];
  const hardest = all.h.reduce((a, b) => a[10] < b[10] ? a : b);
  const easiest = all.h.reduce((a, b) => a[10] > b[10] ? a : b);
  const fieldAvg = all.h.reduce((n, h) => n + h[3], 0);
  const tot = sel[5] + sel[6] + sel[7] + sel[8] + sel[9];
  const seg = (i, k) => `<i class="s-${k}" style="width:${(sel[i] / tot * 100).toFixed(2)}%"></i>`;
  const d2 = v => (v >= 0 ? "+" : "\u2212") + Math.abs(v).toFixed(2).replace(/^0/, "");

  const gridRows = rounds.map((r, i) => {
    const m = byHole(r);
    return (r.r === "All" ? "" : i === 1 ? `<div class="gap"></div>` : "") +
      `<div class="hrlab ${r.r === "All" ? "all" : ""}">${esc(r.r)}</div>` +
      nums.map(n => {
        const h = m[n];
        if (!h) return `<div class="hcell na"></div>`;
        const on = i === ri && h[0] === sel[0];
        return `<div class="hcell ${diffClass(h[4])} ${on ? "sel" : ""}" data-h="${h[0]}" data-r="${i}"
          title="Hole ${h[0]} · ${esc(r.r)} · par ${h[1]} · ${h[2]}y · avg ${h[3]}">${d2(h[4])}</div>`;
      }).join("");
  }).join("");

  return `<div class="hpanel" data-ci="${ci}" data-ri="${ri}" data-hole="${sel[0]}">
    <div class="hptop">
      ${cs.length > 1
        ? `<div class="hpills">${cs.map((x, i) =>
            `<button class="${i === ci ? "on" : ""}" data-c="${i}"
              title="${esc(x.name)}">${esc(courseLabel(x.name))}</button>`).join("")}</div>`
        : `<div class="hcourse">${esc(c.name)}</div>`}
    </div>

    <div class="hkpis">
      <span>Par <b>${c.par}</b></span>
      <span><b>${esc(c.yards || "")}</b> yds</span>
      <span>Field average <b>${fieldAvg.toFixed(2)}</b></span>
      <span class="hard">Hardest <b>${hardest[0]}</b> (${d2(hardest[4])})</span>
      <span class="easy">Easiest <b>${easiest[0]}</b> (${d2(easiest[4])})</span>
    </div>

    <div class="hgrid">
      <div></div>
      ${nums.map(n => `<div class="hhead"><span class="hn">${n}</span>
        <span class="hp">${pars[n][1]}</span></div>`).join("")}
      ${gridRows}
    </div>

    <div class="hbox">
    <div class="hdet">
      <div class="lead">Hole <b>${sel[0]}</b> · par ${sel[1]} · ${pts(sel[2])} yds ·
        <span style="color:var(--dim2)">${esc(rd.r === "All" ? "all rounds" : "round " + rd.r.slice(1))}</span><br>
        avg <i>${sel[3].toFixed(3)}</i> (${d2(sel[4])}) ·
        ${sel[10]}${sel[10] === 1 ? "st" : sel[10] === 2 ? "nd" : sel[10] === 3 ? "rd" : "th"} hardest</div>
      <div>
        <div class="hmix">${seg(5, "eagle")}${seg(6, "birdie")}${seg(7, "par")}${seg(8, "bogey")}${seg(9, "dbl")}</div>
        <div class="hcounts">
          <span><b>${sel[5]}</b>eagle+</span><span><b>${sel[6]}</b>birdie</span>
          <span><b>${sel[7]}</b>par</span><span><b>${sel[8]}</b>bogey</span>
          <span><b>${sel[9]}</b>double+</span><span><b>${pts(tot)}</b>scores</span>
        </div>
      </div>
    </div>
    ${scorerCols(t, c, rd, sel)}
    </div>
  </div>`;
}

/* --------------------------------------------------------- chart cards */
function raceCard() {
  const top = P.slice(0, 30), max = top[0].points;
  return `<div class="card" data-k="race"><div class="inner"><div class="chartwrap">
    <div class="chead">
      <div><div class="crumb"><b>The Race</b></div>
        <div class="ctitle">2026 FedExCup points</div></div>
      <div class="cnote">Points earned across the 37-event FedExCup season, recomputed by summing
        every player's per-event award. The TOUR Championship awards no points — it decides the Cup
        itself — so this list is settled after the BMW Championship. Top 30 of 70 shown.</div>
    </div>
    <div class="rows">${top.map((p, i) => `
      <div class="rrow"><span class="rk">${i + 1}</span>
        <div class="bar"><div class="fill" style="width:${(p.points / max * 100).toFixed(1)}%"></div>
          <div class="blab"><span class="who">${esc(p.name)}</span>
            <span class="val">${pts(p.points)}</span></div></div></div>`).join("")}
    </div>
  </div></div></div>`;
}

function divergeCard() {
  const rows = P.filter(p => p.owgr).slice(0, 30)
    .map(p => ({...p, gap: p.owgr.rank - p.rank}));
  const cell = p => {
    const cls = p.gap > 0 ? "up" : p.gap < 0 ? "down" : "flat";
    const sign = p.gap > 0 ? "+" : "";
    return `<div class="drow">
      <span class="rk" style="color:var(--dim2);text-align:right">${p.rank}</span>
      <span class="nm">${esc(p.name)}</span>
      <span class="n1" style="color:var(--acc)">${pts(p.points)}</span>
      <span class="n2" style="color:var(--acc2)">#${p.owgr.rank}</span>
      <span class="dd ${cls}">${p.gap === 0 ? "—" : sign + p.gap}</span></div>`;
  };
  const head = `<div class="drow h"><span></span><span>Player</span>
    <span class="n1">FedExCup</span><span class="n2">World</span><span class="dd">Gap</span></div>`;
  return `<div class="card" data-k="diverge"><div class="inner"><div class="chartwrap">
    <div class="chead">
      <div><div class="crumb"><b>Two rankings</b></div>
        <div class="ctitle">FedExCup vs the world</div></div>
      <div class="cnote">The FedExCup counts one PGA TOUR season; the Official World Golf Ranking is a
        rolling two-year average across every tour. A positive gap means the world ranking rates a
        player lower than his 2026 season did. The two lists can disagree sharply: only 68 of these
        70 appear in the world top 600 at all, and two of the world's top 25 — Jon Rahm at No. 14 and
        Tyrrell Hatton at No. 24 — finished outside the FedExCup 70 and so have no card here.</div>
    </div>
    <div class="dcols">${head}${rows.slice(0, 14).map(cell).join("")}${head}${rows.slice(14, 28).map(cell).join("")}</div>
  </div></div></div>`;
}

function moneyCard() {
  const by = P.slice().sort((a, b) => cash(b.season.money) - cash(a.season.money)).slice(0, 30);
  const max = cash(by[0].season.money);
  const row = (p, i) => `<div class="mrow">
    <span class="rk">${i + 1}</span>
    <img class="fc" src="img/face/${p.id}.webp" alt="" loading="lazy">
    <span class="nm"><b>${esc(shortName(p))}</b><i>#${p.rank}</i></span>
    <div class="bar"><div class="fill" style="width:${(cash(p.season.money) / max * 100).toFixed(1)}%"></div></div>
    <span class="amt">${abbrMoney(p.season.money)}</span></div>`;
  return `<div class="card" data-k="money"><div class="inner"><div class="chartwrap">
    <div class="chead">
      <div><div class="crumb"><b>The money</b></div>
        <div class="ctitle">2026 official earnings</div></div>
      <div class="cnote">Official money won on the PGA TOUR in 2026, with each player's FedExCup
        points rank beside his name. The two orders come apart because the TOUR Championship pays
        a $40m bonus pool and awards no points at all: Viktor Hovland finished second at East Lake
        and ranks 6th for money against 26th for points. Top 30 of 70 shown.</div>
    </div>
    <div class="mcols">${by.map(row).join("")}</div>
  </div></div></div>`;
}

function holesCard() {
  const by = P.slice().sort((a, b) => (b.scoring?.holes || 0) - (a.scoring?.holes || 0));
  const max = by[0].scoring.holes;
  const SEG = [["eagle", "Eagle or better"], ["birdie", "Birdie"], ["par", "Par"],
               ["bogey", "Bogey"], ["dbl", "Double or worse"]];
  const row = (p, i) => {
    const sc = p.scoring, h = sc.holes || 1;
    const segs = SEG.map(([k]) =>
      `<i class="s-${k}" style="width:${(sc[k] / h * 100).toFixed(2)}%"></i>`).join("");
    const pct = k => (sc[k] / h * 100).toFixed(1);
    return `<div class="hrow" title="${esc(p.name)} — ${sc.holes} holes · ${pct("birdie")}% birdies">
      <span class="rk">${i + 1}</span>
      <span class="nm">${esc(shortName(p))}</span>
      <div class="htrack"><div class="hbar" style="--w:${(h / max * 100).toFixed(1)}%">${segs}</div></div>
      <span class="hn">${pts(sc.holes)}</span></div>`;
  };
  return `<div class="card" data-k="holes"><div class="inner"><div class="chartwrap">
    <div class="chead">
      <div><div class="crumb"><b>Every hole played</b></div>
        <div class="ctitle">2026 holes &amp; how they were scored</div></div>
      <div class="cnote">All 70 players, ranked by holes played in the FedExCup season — bar length
        is the number of holes, the fill is what those holes were scored. 95,000 holes in all:
        62% pars, 22% birdies, 13% bogeys. Alternate-shot rounds record no individual scores, so the
        Zurich Classic is not counted here.</div>
    </div>
    <div class="hkey">${SEG.map(([k, lbl]) =>
      `<span><b class="s-${k}"></b>${lbl}</span>`).join("")}
      <div class="hmode">
        <button class="on" data-mode="abs">Holes played</button>
        <button data-mode="pct">Share %</button>
      </div>
    </div>
    <div class="hcols">${by.map(row).join("")}</div>
  </div></div></div>`;
}

const PREF = {

  set(k, v) { try { localStorage.setItem("pga." + k, v); } catch (e) {} },
};

const byId = {};
T.forEach(t => byId[t.id] = t);

let mPid = null, mIdx = 0;

function openEvent(pid, tid) {
  const p = P.find(x => x.id === pid);
  if (!p) return;
  const i = p.events.findIndex(x => x.tid === tid);
  if (i < 0) return;
  mPid = pid; mIdx = i;
  renderEvent();
  document.getElementById("emodal").classList.add("on");
}

function stepEvent(d) {
  const p = P.find(x => x.id === mPid);
  if (!p) return;
  const n = Math.max(0, Math.min(p.events.length - 1, mIdx + d));
  if (n === mIdx) return;
  mIdx = n;
  renderEvent();
}

function renderEvent() {
  const p = P.find(x => x.id === mPid);
  const e = p.events[mIdx];
  const t = byId[e.tid];
  const rounds = (e.rounds || []).filter(r => r && r !== "-");
  document.getElementById("ebody").innerHTML = `
    <div class="mplayer">${esc(p.name)} · FedExCup No. ${p.rank}</div>
    <h3>${esc(e.name)}</h3>
    <p>${esc(t ? t.date + " 2026 · " + (t.course || "") : e.date)}</p>
    <div class="mgrid">
      <div><div class="k">Position</div><div class="v">${esc(e.pos || "—")}</div></div>
      <div><div class="k">Total</div><div class="v">${esc(e.total || "—")}</div></div>
      <div><div class="k">To par</div><div class="v">${esc(e.toPar || "—")}</div></div>
      <div><div class="k">FedExCup</div><div class="v">${e.pts ? pts(e.pts) : "0"}</div></div>
      <div><div class="k">Earnings</div><div class="v">${abbrMoney(e.money)}</div></div>
    </div>
    ${rounds.length && !(e.card || []).length ? `<div class="mrounds">${rounds.map((r, i) =>
      `<span><i>R${i + 1}</i>${esc(r)}</span>`).join("")}</div>` : ""}
    ${scorecard(e.card)}
    ${t && t.champion.name !== p.name
      ? `<div class="mpager">Won by ${esc(t.champion.name)} · ${esc(t.champion.score || "")}</div>`
      : ""}
    <div class="mpager">${mIdx + 1} / ${p.events.length} · ← → to move through the season</div>`;
  document.getElementById("e-prev").disabled = mIdx === 0;
  document.getElementById("e-next").disabled = mIdx === p.events.length - 1;
}
const SCLASS = d => d <= -2 ? "eagle" : d === -1 ? "birdie" : d === 0 ? "par"
  : d === 1 ? "bogey" : "dbl";

function scorecard(card) {
  if (!card || !card.length) return "";
  const sum = a => a.reduce((x, y) => x + y, 0);
  const rounds = card.map(r => {
    const par = r.p.split("").map(Number);
    const sc = r.s;
    const out = sum(sc.slice(0, 9)), inn = sum(sc.slice(9)), tot = out + inn;
    const pOut = sum(par.slice(0, 9)), pIn = sum(par.slice(9));
    const cells = (from, to, cls, fn) => sc.slice(from, to)
      .map((v, i) => fn(v, par[from + i])).join("");
    const hole = (v, p) => v ? `<div><span class="sq ${SCLASS(v - p)}">${v}</span></div>`
                             : `<div><span class="sq par">–</span></div>`;
    return `<div class="sc">
      <div class="scr"><b>Round ${r.n}</b>
        ${r.c ? `<span>${esc(r.c)}</span>` : ""}
        <span>${esc(r.t)} <em>(${esc(r.tp)})</em></span></div>
      <div class="scg">
        <div class="lab">Hole</div>
        ${par.slice(0, 9).map((_, i) => `<div class="hn">${i + 1}</div>`).join("")}
        <div class="hn">Out</div>
        ${par.slice(9).map((_, i) => `<div class="hn">${i + 10}</div>`).join("")}
        <div class="hn">In</div><div class="hn">Tot</div>

        <div class="lab">Par</div>
        ${par.slice(0, 9).map(p => `<div class="pr">${p}</div>`).join("")}
        <div class="pr">${pOut}</div>
        ${par.slice(9).map(p => `<div class="pr">${p}</div>`).join("")}
        <div class="pr">${pIn}</div><div class="pr">${pOut + pIn}</div>

        <div class="lab">Score</div>
        ${cells(0, 9, "", hole)}
        <div class="sub">${out}</div>
        ${cells(9, 18, "", hole)}
        <div class="sub">${inn}</div><div class="tot">${tot}</div>
      </div></div>`;
  }).join("");
  return `<h5>Scorecard</h5><div class="scwrap">${rounds}</div>
    <div class="sclegend">
      <span><i class="sq eagle" style="font-style:normal">2</i> Eagle or better</span>
      <span><i class="sq birdie" style="font-style:normal">3</i> Birdie</span>
      <span><i class="sq bogey" style="font-style:normal">5</i> Bogey</span>
      <span><i class="sq dbl" style="font-style:normal">6</i> Double or worse</span>
    </div>`;
}

let jSel = 0;
function jRender(rows) {
  document.getElementById("jlist").innerHTML = rows.map((r, i) =>
    `<div class="jrow ${i === jSel ? "sel" : ""}" data-n="${r.n}">
       <span class="jn">${r.n}</span>
       <span><b>${esc(r.label)}</b></span>
       <span class="jt">${esc(r.meta)}</span></div>`).join("")
    || `<div class="jrow"><span class="jn">—</span><span>No card matches that.</span><span></span></div>`;
}
function jMatches() {
  const q = document.getElementById("jq").value.trim().toLowerCase();
  if (!q) return INDEX;
  if (/^\d+$/.test(q)) {
    const n = +q;
    return INDEX.filter(r => String(r.n).startsWith(q) || r.n === n).slice(0, 40);
  }
  return INDEX.filter(r => r.hay.includes(q)).slice(0, 40);
}
function jUpdate() { jRender(jMatches()); }

function openJump() {
  jSel = 0;
  const q = document.getElementById("jq");

  document.getElementById("jmodal").classList.add("on");

}

document.getElementById("jq").addEventListener("keydown", e => {
  const rows = jMatches();
  if (e.key === "ArrowDown") { e.preventDefault(); jSel = Math.min(rows.length - 1, jSel + 1); jRender(rows);
    document.querySelector(".jrow.sel")?.scrollIntoView({block: "nearest"}); }
  if (e.key === "ArrowUp") { e.preventDefault(); jSel = Math.max(0, jSel - 1); jRender(rows);
    document.querySelector(".jrow.sel")?.scrollIntoView({block: "nearest"}); }
  if (e.key === "Enter" && rows[jSel]) { closeModal("jmodal"); go(rows[jSel].n - 1); }
});

      published final standings, which since the staggered start was dropped rank the top 30 by
      their finishing position at the TOUR Championship. By that measure the order after Scheffler
      is Hovland and Gerard; by a full season's points it is Fitzpatrick and Clark.</p>
    <h5>A note on who is missing</h5>
    <p>These are the 70 players who finished highest on one season's FedExCup points, so a golfer can
      be ranked among the best in the world and still have no card — the ranking rewards a full PGA
      TOUR season, not form. Jon Rahm (world No. 14) and Tyrrell Hatton (world No. 24) are the two
      players from the current world top 25 with no card in this deck. Players outside the top 70
      still appear on the tournament cards, on the leaderboards of the events they played. The
      <i>FedExCup vs the world</i> card sets the two rankings side by side.</p>

<!-- Cloudflare Web Analytics --><script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "fe04a6d39d534fe680ba0b0e58131b31"}'></script><!-- End Cloudflare Web Analytics -->

<script>
const DATA = /*__DATA__*/{players:[],tournaments:[]};
const P = DATA.players, T = DATA.tournaments;

/* ---------------------------------------------------- the scorecard store
   Every card of the season, whole field, keyed "<playerId>_<tournamentId>".
   Rounds arrive packed - [n, total, toPar, parIdx, courseIdx, scores] with one
   base-36 character a hole - and are unpacked on demand, then memoised, so a
   card costs nothing until something asks to draw it. */
const SC = DATA.cards || {}, SCPAR = DATA.pars || [], SCCOURSE = DATA.courses || [];
const scCache = new Map();
function scoreCard(pid, tid) {
  const k = pid + "_" + tid;
  if (scCache.has(k)) return scCache.get(k);
  const raw = SC[k];
  const v = raw ? raw.map(r => ({
    n: r[0], t: r[1], tp: r[2],
    p: SCPAR[r[3]],
    c: r[4] >= 0 ? SCCOURSE[r[4]] : "",
    s: Array.from(r[5], ch => parseInt(ch, 36) || 0),
  })) : null;
  scCache.set(k, v);
  return v;
}
const toPar = v => v == null ? "" : v > 0 ? "+" + v : v === 0 ? "E" : String(v);
/* score against par -> the class every scorecard, heat map and leaderboard cell
   shares. Declared here because the first render reads it. */
const SCLASS = d => d <= -2 ? "eagle" : d === -1 ? "birdie" : d === 0 ? "par"
  : d === 1 ? "bogey" : "dbl";

/* every card at one tournament, in leaderboard order - built once per event */
const fieldCache = new Map();
function fieldCards(t) {
  if (fieldCache.has(t.id)) return fieldCache.get(t.id);
  const out = [];
  t.leaderboard.forEach((r, i) => {
    const c = scoreCard(r.id, t.id);
    if (c) out.push({id: r.id, name: r.name, order: i, rank: rankOf(r.id), card: c});
  });
  fieldCache.set(t.id, out);
  return out;
}

/* ------------------------------------------------------------- helpers */
const esc = s => String(s ?? "").replace(/[&<>"]/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const money = s => s || "—";
const cash = s => +String(s || "").replace(/[^0-9]/g, "") || 0;
/* share of holes, shown small and grey beside the count */
const share = (n, holes) => holes
  ? `<em>${(n / holes * 100).toFixed(n / holes < 0.02 ? 1 : 0)}%</em>` : "";
const abbrMoney = s => {
  const n = cash(s);
  if (!n) return "—";
  return n >= 1e6 ? "$" + (n / 1e6).toFixed(1) + "M" : "$" + Math.round(n / 1e3) + "K";
};
const pts = n => (+n).toLocaleString("en-US", {maximumFractionDigits: 0});
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const shortDate = d => {                       // the TOUR sends "1.25.2026"
  const p = String(d || "").split(".");
  return p.length >= 2 && MON[+p[0] - 1] ? `${MON[+p[0] - 1]} ${+p[1]}` : (d || "");
};
const flag = c => c ? `<img class="fl" src="https://flagcdn.com/24x18/${iso(c)}.png" alt="">` : "";
/* PGA uses IOC-ish 3-letter codes incl. UK home nations; flagcdn wants 2-letter (+gb-eng etc.) */
const ISO = {USA:"us",ENG:"gb-eng",SCO:"gb-sct",NIR:"gb-nir",WAL:"gb-wls",IRL:"ie",RSA:"za",
  AUS:"au",CAN:"ca",JPN:"jp",KOR:"kr",NOR:"no",SWE:"se",DEN:"dk",ESP:"es",GER:"de",FRA:"fr",
  ITA:"it",AUT:"at",BEL:"be",NED:"nl",FIN:"fi",COL:"co",ARG:"ar",CHI:"cl",VEN:"ve",MEX:"mx",
  NZL:"nz",TPE:"tw",CHN:"cn",IND:"in",THA:"th",PHI:"ph",ZIM:"zw",PAR:"py",PUR:"pr",BRA:"br"};
const iso = c => ISO[c] || (c || "").slice(0, 2).toLowerCase();

const CAT = {major:["Major","--major"], playoff:["Playoff","--playoff"],
  signature:["Signature","--signature"], players:["The Players","--players"],
  full:["Full field","--full"], opposite:["Opposite field","--opposite"]};

/* three different Kims in the top 70 alone, and many more across the full field -
   only add an initial where the surname is actually shared */
const SURNAME_DUPES = (() => {
  const c = {}, seen = new Set();
  const add = (name) => {
    if (seen.has(name)) return;
    seen.add(name);
    const l = name.split(" ").slice(-1)[0];
    c[l] = (c[l] || 0) + 1;
  };
  P.forEach(p => add(p.name));
  T.forEach(t => t.leaderboard.forEach(r => add(r.name)));
  return c;
})();
const shortName = p => {
  const name = typeof p === "string" ? p : p.name;
  const first = typeof p === "string" ? name.split(" ")[0] : (p.first || name.split(" ")[0]);
  const l = typeof p === "string" ? name.split(" ").slice(-1)[0]
                                  : (p.last || name.split(" ").slice(-1)[0]);
  return SURNAME_DUPES[l] > 1 && first ? `${first[0]}. ${l}` : l;
};
const pById = (() => { const m = {}; P.forEach(p => m[p.id] = p); return m; })();
const rankOf = id => (pById[id] || {}).rank || 999;
/* the 70 carry a parsed surname in their bio, so prefer that over a last-token guess */
const nameOf = (id, fallback) => shortName(pById[id] || fallback);

const CARDS = [];
P.forEach((p, i) => CARDS.push({kind: "player", d: p, i}));
T.forEach((t, i) => CARDS.push({kind: "tournament", d: t, i}));
CARDS.push({kind: "race"}, {kind: "money"}, {kind: "holes"}, {kind: "diverge"});
const SEC = [0, P.length, P.length + T.length];

/* -------------------------------------------------------- player card */
/* How a run of events broke down, as one bar - a season or a whole career. The
   TOUR's top-10 and top-25 counts are cumulative - a win sits inside both - so
   each band is the difference from the one above it, and the five sum to the
   events played. "Cuts made" arrives as "19/20", hence the parse. */
function recordMix(s, fallbackEvents, winsOverride) {
  s = s || {};
  const ev = +s.events || fallbackEvents || 0;
  const cuts = parseInt(String(s.cuts || "").split("/")[0], 10);
  if (!ev || isNaN(cuts)) return "";
  const w = +(s.wins ?? winsOverride) || 0, t10 = +s.top10 || 0, t25 = +s.top25 || 0;
  const bands = [
    ["win", "Won", w],
    ["t10", "Top 10", t10 - w],
    ["t25", "Top 25", t25 - t10],
    ["rest", "Made the cut", cuts - t25],
    ["cut", "Missed the cut", ev - cuts],
  ].filter(([, , n]) => n > 0);
  if (!bands.length) return "";
  return `<div class="pmix" title="${bands.map(([, l, n]) => `${n} ${l}`).join(" · ")}">
    ${bands.map(([k, , n]) =>
      `<i class="s-${k}" style="width:${(n / ev * 100).toFixed(2)}%"></i>`).join("")}
  </div>`;
}
const seasonMix = p => recordMix(p.season, (p.events || []).length);
const careerMix = p => recordMix(p.career, 0, p.bio && p.bio.careerWins);

function playerCard(p) {
  const nameSize = Math.min(40, 400 / Math.max(9, p.name.length));
  const ow = p.owgr;
  const c = p.career || {};
  const sc = p.scoring || {};
  const evs = p.events;                      // already chronological, Jan -> Aug
  return `<div class="card" data-k="player">
    <div class="t-bg p-bg nophoto"><img alt="" loading="lazy"></div>
    <div class="inner pl-inner">
      <div class="pbody">
        <div class="pcol">

          <div class="ptop">
            <div class="pphoto"><div class="phrank">${String(p.rank).padStart(2, "0")}</div><img src="img/full/${p.id}.webp" alt="${esc(p.name)}" loading="lazy"></div>
            <div class="pinfo">
              <div class="pname" style="font-size:clamp(20px,${nameSize / 13}vw,${nameSize}px)">${esc(p.name)}</div>
              <div class="crumb"><span>${flag(p.flag)}${esc(p.country)}</span></div>
              <div class="psub">
                <span>Age <b>${esc(p.bio.age || "—")}</b></span>
                <span>Turned pro <b>${esc(p.bio.turnedPro || "—")}</b></span>
                ${c.tourCard ? `<span>TOUR card <b>${esc(c.tourCard)}</b></span>` : ""}
              </div>
              ${p.bio.college ? `<div class="psub"><span>College <b>${esc(p.bio.college)}</b></span></div>` : ""}
              ${p.bio.birthplace ? `<div class="psub"><span>Born <b>${esc(p.bio.birthplace)}</b></span></div>` : ""}
            </div>
          </div>

          <div class="pstats">
          <div class="pbox">
            <div class="boxlegend">2026 Rankings</div>
            <div class="boxgrid four">
              <div class="cell hero"><b>${p.rank}</b><i>FedExCup</i></div>
              <div class="cell"><b>${pts(p.points)}</b><i>Points</i></div>
              <div class="cell world"><b>${ow ? ow.rank : "—"}</b><i>World rank</i></div>
              <div class="cell"><b>${ow ? ow.avg : "—"}</b><i>World avg</i></div>
            </div>
          </div>

          <div class="pbox mix">
            <div class="boxlegend">2026 season</div>
            <div class="boxgrid six">
              <div class="cell"><b>${esc(p.season.events || evs.length)}</b><i>Events</i></div>
              <div class="cell"><b>${esc(p.season.cuts || "—")}</b><i>Cuts made</i></div>
              <div class="cell${p.season.wins > 0 ? " hero" : ""}"><b>${esc(p.season.wins || 0)}</b><i>Wins</i></div>
              <div class="cell"><b>${esc(p.season.top10 || 0)}</b><i>Top 10</i></div>
              <div class="cell"><b>${esc(p.season.top25 || 0)}</b><i>Top 25</i></div>
              <div class="cell"><b>${abbrMoney(p.season.money)}</b><i>Earnings</i></div>
            </div>
            ${seasonMix(p)}
          </div>

          <div class="pbox mix">
            <div class="boxlegend">2026 Scoring</div>
            <div class="boxgrid seven">
              <div class="cell"><b>${pts(sc.holes || 0)}</b><i>Holes</i></div>
              <div class="cell"><b>${pts(sc.shots || 0)}</b><i>Shots</i></div>
              <div class="cell${sc.eagle ? " hero" : ""}"><b>${esc(sc.eagle || 0)}${share(sc.eagle, sc.holes)}</b><i>Eagles+</i></div>
              <div class="cell"><b>${pts(sc.birdie || 0)}${share(sc.birdie, sc.holes)}</b><i>Birdies</i></div>
              <div class="cell"><b>${pts(sc.par || 0)}${share(sc.par, sc.holes)}</b><i>Pars</i></div>
              <div class="cell"><b>${pts(sc.bogey || 0)}${share(sc.bogey, sc.holes)}</b><i>Bogeys</i></div>
              <div class="cell"><b>${esc(sc.dbl || 0)}${share(sc.dbl, sc.holes)}</b><i>Double+</i></div>
            </div>
            <div class="pmix" title="${["eagle","birdie","par","bogey","dbl"]
              .map(k => `${sc[k] || 0} ${k}`).join(" · ")}">
              ${["eagle", "birdie", "par", "bogey", "dbl"].map(k =>
                `<i class="s-${k}" style="width:${((sc[k] || 0) / (sc.holes || 1) * 100).toFixed(2)}%"></i>`
              ).join("")}
            </div>
          </div>

          <div class="pbox mix">
            <div class="boxlegend">All-time on TOUR</div>
            <div class="boxgrid six">
              <div class="cell"><b>${esc(c.events || "—")}</b><i>Events</i></div>
              <div class="cell"><b>${esc(c.cuts || "—")}</b><i>Cuts made</i></div>
              <div class="cell"><b>${esc(c.wins ?? p.bio.careerWins ?? "—")}</b><i>Wins</i></div>
              <div class="cell"><b>${esc(c.top10 || "—")}</b><i>Top 10</i></div>
              <div class="cell"><b>${esc(c.top25 || "—")}</b><i>Top 25</i></div>
              <div class="cell"><b>${abbrMoney(c.money)}</b><i>Earnings</i></div>
            </div>
            ${careerMix(p)}
          </div>
          </div>
          <div class="pevent" hidden></div>
        </div>

        <div class="pres">
          <div class="tabs">
            <button class="tab on" data-tab="results">Results</button>
            <button class="tab" data-tab="stats">Stats</button>
          </div>
          <div class="pane">
            <div class="evlist" data-pane="results">${EVHEAD}${evs.map(e => evRow(e, p)).join("")}</div>
            <div class="statpane" data-pane="stats" hidden>${statsPane(p)}</div>
          </div>
        </div>
      </div>
    </div></div>`;
}

/* The same grid the tournament card draws, for one player's week: the field's
   own difficulty on each hole, then that player's rounds under it. Rotating
   weeks get one block a course, since par and difficulty both change. */
function eventGrid(p, e) {
  const card = scoreCard(p.id, e.tid);
  if (!card || !card.length) return "";
  const t = byId[e.tid];
  const courses = (t && t.holes) || [];

  const groups = [];
  card.forEach(r => {
    const name = r.c || (courses.length === 1 ? courses[0].name : "");
    let g = groups.find(x => x.name === name);
    if (!g) groups.push(g = {name, rounds: []});
    g.rounds.push(r);
  });

  return groups.map(g => {
    const par = Object.fromEntries([...Array(18)].map((_, i) => [i + 1, +g.rounds[0].p[i]]));
    const nums = Object.keys(par).map(Number);
    const cs = courses.find(c => c.name === g.name) || (courses.length === 1 ? courses[0] : null);
    const all = cs && cs.rounds.find(r => r.r === "All");
    const byHole = all ? Object.fromEntries(all.h.map(h => [h[0], h])) : null;
    return `${groups.length > 1
        ? `<div class="egcourse">${esc(courseLabel(g.name) || g.name)}</div>` : ""}
      <div class="hgrid eg">
        ${gridHead(nums, par)}
        ${g.rounds.map(scoreRowCells).join("")}
        ${summaryRows(nums, byHole, g.rounds, shortName(p))}
      </div>`;
  }).join("");
}

/* One start, drawn in the left column in place of the season boxes. The results
   list stays live beside it, so clicking another row walks the season. */
function eventPanel(p, e) {
  const t = byId[e.tid];
  const kpi = (k, v) => `<div><div class="k">${k}</div><div class="v">${v}</div></div>`;
  return `<div class="pehead">
      <button class="pback" title="Back to the season (Esc)">&larr; 2026 season</button>
      <h4 style="font-size:clamp(12px,calc((40.4vw - 144px) / ${
        (e.name.length * 0.6).toFixed(1)}),23px)" title="${esc(e.name)}">${esc(e.name)}</h4>
      <p>${t ? `${esc(t.date)} 2026 · ${esc(t.course || "")}` : esc(e.date)}${(() => {
        const cs = (t && t.holes) || [];
        const pars = [...new Set(cs.map(c => c.par).filter(Boolean))];
        return pars.length === 1 ? ` · Par <b>${pars[0]}</b>` : "";
      })()}</p>
    </div>
    <div class="mgrid">
      ${kpi("Position", esc(e.pos || "\u2014"))}
      ${kpi("Total", esc(e.total || "\u2014"))}
      ${kpi("To par", esc(e.toPar || "\u2014"))}
      ${kpi("FedExCup", e.pts ? pts(e.pts) : "0")}
      ${kpi("Earnings", abbrMoney(e.money))}
    </div>
    ${eventGrid(p, e)}
    ${scoreCard(p.id, e.tid) ? `<div class="sclegend">
      <span><i class="sq eagle" style="font-style:normal">2</i> Eagle or better</span>
      <span><i class="sq birdie" style="font-style:normal">3</i> Birdie</span>
      <span><i class="sq bogey" style="font-style:normal">5</i> Bogey</span>
      <span><i class="sq dbl" style="font-style:normal">6</i> Double or worse</span>
    </div>
    ${byId[e.tid] && byId[e.tid].holes && byId[e.tid].holes.length
      ? `<p class="egnote"><b>Field</b> is the whole field's average against par,
         <b>Player</b> is ${esc(shortName(p))}'s own, and <b>Gap</b> the difference \u2014
         green means he beat the field there.</p>` : ""}` : ""}
    ${t && t.champion.name !== p.name
      ? `<p class="pewon">Won by ${esc(t.champion.name)} · ${esc(t.champion.score || "")}</p>`
      : ""}`;
}

/* the open week's course backs the card, when the deck holds a photo for it */
function setCardPhoto(card, tid) {
  const bg = card.querySelector(".p-bg");
  if (!bg) return;
  const img = bg.querySelector("img");
  if (tid && HAS_PHOTO.has(tid)) {
    const src = `img/course/${tid}.webp`;
    if (!img.src.endsWith(src)) img.src = src;
    img.alt = (byId[tid] || {}).course || "";
    bg.classList.remove("nophoto");
  } else {
    bg.classList.add("nophoto");
    img.removeAttribute("src");
  }
}

function openInlineEvent(card, pid, tid) {
  const p = P.find(x => x.id === pid);
  const e = p && p.events.find(x => x.tid === tid);
  if (!e) return;
  setCardPhoto(card, tid);
  card.querySelector(".pevent").innerHTML = eventPanel(p, e);
  card.querySelector(".pevent").hidden = false;
  card.querySelector(".pstats").hidden = true;
  card.querySelectorAll(".ev.sel").forEach(x => x.classList.remove("sel"));
  card.querySelectorAll(`.ev[data-ev="${tid}"]`).forEach(x => x.classList.add("sel"));
}

function closeInlineEvent(card) {
  const box = card.querySelector(".pevent");
  if (!box || box.hidden) return false;
  setCardPhoto(card, null);
  box.hidden = true;
  box.innerHTML = "";
  card.querySelector(".pstats").hidden = false;
  card.querySelectorAll(".ev.sel").forEach(x => x.classList.remove("sel"));
  return true;
}

const SG_ROWS = [["total", "SG: Total"], ["ott", "Off the tee"], ["app", "Approach"],
                 ["arg", "Around the green"], ["putt", "Putting"]];
const SG_MAX = 2.6;   // strokes gained per round; nobody in this field exceeds it

function statsPane(p) {
  if (!p.sg) return `<p class="none">No 2026 stats published for this player.</p>`;
  const sgRow = ([k, label]) => {
    const d = p.sg[k], v = d.v;
    const w = Math.min(50, Math.abs(v) / SG_MAX * 50);
    const style = v >= 0 ? `left:50%;width:${w}%` : `right:50%;width:${w}%`;
    return `<div class="sgrow ${k === "total" ? "tot" : ""}">
      <span class="t">${label}</span>
      <div class="sgaxis"><div class="sgfill ${v >= 0 ? "pos" : "neg"}" style="${style}"></div></div>
      <span class="v" style="color:${v >= 0 ? "#3fe08a" : "#e8534e"}">${v >= 0 ? "+" : ""}${v.toFixed(3)}</span>
      <span class="rk">${d.r ? `<b>${d.r}</b>` : "—"}</span></div>`;
  };
  const grp = ([g, items]) => `<div class="stgrp">${esc(g)}</div>` +
    items.map(([t, v, r]) =>
      `<div class="strow"><span class="t">${esc(t)}</span>
        <span class="v">${esc(v)}</span>
        <span class="rk">${r ? `<b>${esc(r)}</b>` : "—"}</span></div>`).join("");
  const g = p.stats || [];
  return `<div class="sgblock">
      <div class="sglab">Strokes gained per round · TOUR rank</div>
      ${SG_ROWS.map(sgRow).join("")}
    </div>
    <div class="stgrid">
      <div class="stcol">${g.slice(0, 3).map(grp).join("")}</div>
      <div class="stcol">${g.slice(3).map(grp).join("")}</div>
    </div>
    <div class="sgnote">Strokes gained measures a player against the field: <b>+1.0</b> means a
      stroke a round better than the average player in the same events. The four parts add up to
      the total. The TOUR does not publish an around-the-green figure in this feed, so it is
      derived — total minus the other three — and has no rank.</div>`;
}

function posClass(e) {
  const pos = (e.pos || "").replace("T", "");
  if (e.pos === "1") return "win";
  if (/CUT|WD|DQ|MDF/i.test(e.pos || "")) return "cut";
  return +pos <= 10 ? "top10" : "";
}
function evRow(e, p) {
  return `<div class="ev ${posClass(e)}" data-ev="${esc(e.tid)}" data-pid="${p.id}">
    <span class="d">${esc(shortDate(e.date))}</span>
    <span class="n">${esc(e.name)}</span>
    <span class="p">${esc(e.pos || "—")}</span>
    <span class="r">${(e.rounds || []).filter(r => r && r !== "-").join(" ") || "—"}</span>
    <span class="tt">${esc(e.total || "—")}</span>
    <span class="tp">${esc(e.toPar || "—")}</span>
    <span class="pt"${e.pts ? "" : " data-none"}>${e.pts ? pts(e.pts) : "—"}</span>
    <span class="mo">${e.money && e.money !== "-" ? abbrMoney(e.money) : "—"}</span></div>`;
}

const EVHEAD = `<div class="evhead">
  <span>Date</span><span>Tournament</span><span>Pos</span><span class="r">Rounds</span>
  <span class="tt">Total</span><span class="tp">To par</span><span class="pt">Pts</span>
  <span class="mo">Money</span></div>`;
</script>
<script>
/* ---------------------------------------------------- tournament card */
const HAS_PHOTO = new Set(/*__PHOTOS__*/[]);

function tournamentCard(t) {
  const [label, varname] = CAT[t.category] || CAT.full;
  const photo = HAS_PHOTO.has(t.id);
  const ch = t.champion;
  const rows = t.leaderboard;
  const open = openingPid(t);
  const where = [t.city, t.state || (t.countryCode !== "USA" ? t.countryCode : "")]
    .filter(Boolean).join(", ");
  const nameMax = t.name.length > 34 ? 27 : t.name.length > 24 ? 33 : 40;
  const nameVw = (nameMax / 15).toFixed(2);
  const wLen = (ch.name || "").length;
  const winMax = wLen > 26 ? 13 : wLen > 18 ? 16 : 21;
  const faces = (ch.ids && ch.ids.length ? ch.ids : [ch.id]).filter(Boolean);
  return `<div class="card" data-k="tournament" data-tid="${t.id}">
    <div class="t-bg ${photo ? "" : "nophoto"}">
      ${photo ? `<img src="img/course/${t.id}.webp" alt="${esc(t.course || "")}" loading="lazy">` : ""}
    </div>
    <div class="inner t-inner">
      <div class="t-left">
        <div class="thead">
          <img class="tlogo" src="img/logo/${t.id}.png" alt="" loading="lazy">
          <div class="tname" style="font-size:clamp(17px,${nameVw}vw,${nameMax}px)">${esc(t.name)}</div>
          <div class="twin">
            ${faces.map(id => `<img src="img/face/${id}.webp" alt="" loading="lazy">`).join("")}
            <div class="tw-t">
              <span class="lbl">Won by</span>
              <span class="nm" style="font-size:clamp(12px,${(winMax / 14).toFixed(2)}vw,${winMax}px)">${esc(ch.name || "—")}</span>
              <span class="cd">${esc(ch.score || "")}${ch.strokes ? ` · ${ch.strokes} strokes` : ""}${ch.earnings ? ` · ${esc(ch.earnings)}` : ""}</span>
            </div>
          </div>
        </div>
        <div class="tmeta">
          <span class="badge" style="background:var(${varname})">${label}</span>
          <span><b>${esc(t.date)}</b> 2026</span>
          <span>${esc(t.course || "")}</span>
          ${where ? `<span>${esc(where)}</span>` : ""}
        </div>
        <div class="tmeta">
          <span>Purse <b>${esc(t.purse || "—")}</b></span>
          <span>Field <b>${t.field}</b></span>
          ${ch.points && ch.points !== "0" ? `<span>Winner's points <b>${esc(ch.points)}</b></span>` : ""}
          ${t.team ? `<span><b>Two-man teams</b></span>` : ""}
        </div>

        ${holePanel(t)}

      </div>
      <div class="t-right">
        <div class="lbhead"><span>Pos</span><span>${t.team ? "Team" : "Player"}</span>
          <span style="text-align:right">Rounds</span><span style="text-align:right">Total</span>
          <span class="hs"></span></div>
        <div class="lb">${rows.map((r, i) => `
          <div class="lbrow ${i === 0 ? "w" : ""}${SC[r.id + "_" + t.id] ? " has" : ""}${
              r.id === open ? " sel" : ""}"
            data-i="${i}"${SC[r.id + "_" + t.id] ? ` title="Show this card on the left"` : ""}>
            <span class="pos">${esc(r.pos || "")}</span>
            <span class="nm">${esc(r.name)}${r.amateur ? " (a)" : ""}</span>
            <span class="rd">${(r.rounds || []).filter(Boolean).join(" ")}</span>
            <span class="tot">${esc(r.total || "")}</span>
            <span class="hs"></span>
          </div>`).join("")}</div>
        ${rows.length > 12
          ? `<button class="lbmore" data-n="${rows.length}">Show all ${rows.length}</button>`
          : ""}
      </div>
    </div></div>`;
}

/* ------------------------------ per-hole field scoring on a tournament */
/* hole row = [num, par, yards, avg, diffVsPar, eagles, birdies, pars, bogeys, doubles, rank] */
const diffClass = d => d >= .15 ? "d2" : d >= .05 ? "d1"
  : d <= -.25 ? "e2" : d <= -.05 ? "e1" : "d0";
const d2 = v => (v >= 0 ? "+" : "\u2212") + Math.abs(v).toFixed(2).replace(/^0/, "");

/* ---- the three pieces every hole grid is built from, so the tournament card
   and the player card cannot drift apart again. All share one column track:
   a label, 18 holes, then Out / In / Tot. ---- */
const front = nums => nums.filter(n => n <= 9);
const back = nums => nums.filter(n => n > 9);

const gridHead = (nums, par) => {
  const out = front(nums).reduce((a, n) => a + par[n], 0);
  const inn = back(nums).reduce((a, n) => a + par[n], 0);
  const head = n => `<div class="hhead"><span class="hn">${n}</span>
    <span class="hp">${par[n]}</span></div>`;
  const sum = (l, v) => `<div class="hhead sum"><span class="hn">${l}</span>
    <span class="hp">${v}</span></div>`;
  return `<div></div>` +
    front(nums).map(head).join("") + sum("Out", out) +
    back(nums).map(head).join("") + sum("In", inn) + sum("Tot", out + inn);
};

/* A row of numbers against par - the field's, a player's, or the gap between.
   Same shading either way: red played over, green under, and for the gap a
   negative number means the player beat the field. */
const diffRow = (label, nums, val, opts = {}) => {
  const nine = ns => ns.reduce((a, n) => a + (val(n) ?? 0), 0);
  const out = nine(front(nums)), inn = nine(back(nums));
  const cell = n => {
    const v = val(n);
    if (v === null || v === undefined) return `<div class="hcell na"></div>`;
    const on = opts.selHole === n;
    return `<div class="hcell ${diffClass(v)} ${on ? "sel" : ""}"${
      opts.data === undefined ? "" : ` data-h="${n}" data-r="${opts.data}"`}${
      opts.title ? ` title="${esc(opts.title(n))}"` : ""}>${d2(v)}</div>`;
  };
  const sum = v => `<div class="hsum">${d2(v)}</div>`;
  return `<div class="hrlab ${opts.cls || ""}">${esc(label)}</div>` +
    front(nums).map(cell).join("") + sum(out) +
    back(nums).map(cell).join("") + sum(inn) + sum(out + inn);
};

/* how the field played each hole - h is [num,par,yards,avg,diff,...] */
const fieldRow = (label, nums, byHole, opts = {}) =>
  diffRow(label, nums, n => byHole[n] ? byHole[n][4] : null, {...opts,
    title: n => byHole[n]
      ? `Hole ${n} · ${label} · par ${byHole[n][1]} · ${byHole[n][2]}y · avg ${byHole[n][3]}`
      : ""});

/* the player's own average against par on a hole, across the rounds he played */
const playerAvg = (rounds, n) => {
  const v = rounds.map(r => r.s[n - 1]).filter(Boolean);
  if (!v.length) return null;
  return v.reduce((a, b) => a + b, 0) / v.length - (+rounds[0].p[n - 1]);
};

/* Field / player / gap, the block that closes every hole grid */
function summaryRows(nums, byHole, rounds, who, fieldOpts = {}, showField = true) {
  const field = n => byHole && byHole[n] ? byHole[n][4] : null;
  const mine = n => rounds && rounds.length ? playerAvg(rounds, n) : null;
  const rows = [];
  if (byHole && showField) rows.push(fieldRow("Field", nums, byHole, {cls: "all", ...fieldOpts}));
  if (rounds && rounds.length) {
    rows.push(diffRow("Player", nums, mine, {cls: "me",
      title: n => `Hole ${n} · ${who}'s average against par`}));
    if (byHole) rows.push(diffRow("Gap", nums,
      n => (mine(n) === null || field(n) === null) ? null : mine(n) - field(n),
      {cls: "gaprow", title: n => `Hole ${n} · ${who} against the field`}));
  }
  return rows.length ? `<div class="gap"></div>` + rows.join("") : "";
}

/* one round of one player's card */
const scoreRowCells = r => {
  const holes = [...Array(18)].map((_, i) => i + 1);
  const nine = ns => ns.reduce((a, n) => a + (r.s[n - 1] || 0), 0);
  const out = nine(front(holes)), inn = nine(back(holes));
  const cell = n => {
    const v = r.s[n - 1], par = +r.p[n - 1];
    return v ? `<div class="scell" title="Hole ${n} · par ${par} · ${v}"><span
        class="sq ${SCLASS(v - par)}">${v}</span></div>`
      : `<div class="scell"></div>`;
  };
  return `<div class="hrlab sc">R${r.n}</div>` +
    front(holes).map(cell).join("") + `<div class="hsum">${out || ""}</div>` +
    back(holes).map(cell).join("") + `<div class="hsum">${inn || ""}</div>` +
    `<div class="hsum tot">${r.t}</div>`;
};

/* "Torrey Pines Golf Course (South Course)" -> "South"; otherwise trim the filler */
const courseLabel = n => {
  const p = /\(([^)]+)\)/.exec(n || "");
  const base = p ? p[1] : n || "";
  return base.replace(/\s*(Golf Club|Golf Course|Golf Links|Country Club|Course)\s*$/i, "").trim()
    || base;
};

/* How many started a given course/round, and how many of them we hold cards for.
   Per-hole counts dip when someone withdraws mid-round, so take the busiest hole. */
function roundField(rd) {
  return Math.max(...rd.h.map(h => h[5] + h[6] + h[7] + h[8] + h[9]));
}

function roundOurs(t, courseName, roundNum) {
  return fieldCards(t).filter(f => f.card.some(r =>
    r.n === roundNum && (!r.c || r.c === courseName) && r.s.some(Boolean))).length;
}

/* A tournament card opens on the winner's card rather than an empty half-column,
   so the left panel is never blank and the link to the leaderboard is visible. */
const openingPid = t => (t.leaderboard.find(r => SC[r.id + "_" + t.id]) || {}).id || "";

/* One player's rounds, dropped into the heat map's own column track so a score
   sits directly under the hole it was made on. Only the rounds played on the
   course the panel is showing - at the three rotating events the rest are named
   in the footnote instead. */
function playerRows(t, c, nums, pid) {
  if (!pid) return "";
  const row = t.leaderboard.find(r => r.id === pid);
  const card = scoreCard(pid, t.id);
  if (!row || !card) return "";
  const here = card.filter(r => !r.c || r.c === c.name);
  const away = card.filter(r => r.c && r.c !== c.name);
  const strokes = (row.rounds || []).filter(x => x && x !== "-")
    .reduce((n, x) => n + (+x || 0), 0);

  const rows = here.map(scoreRowCells).join("");

  return `<div class="gap scgap"></div>
    <div class="sclab">
      <b>${esc(row.name)}</b>
      <span>${esc(row.pos || "")} · ${strokes || "—"} (${esc(row.total || "")})</span>
      ${away.length ? `<em>R${away.map(r => r.n).join(", R")} played
        ${away.length > 1 ? "elsewhere" : "on " + esc(courseLabel(away[0].c))}</em>` : ""}
      <i>click the row again to clear</i>
    </div>
    ${rows}`;
}

function holePanel(t, ci = 0, ri = 0, hole = 0, pid = null) {
  const cs = t.holes;
  if (!cs || !cs.length) return "";
  if (pid === null) pid = openingPid(t);
  const c = cs[Math.min(ci, cs.length - 1)];
  /* the feed returns All, R4..R1 - read it chronologically instead */
  const rounds = c.rounds.slice().sort((a, b) =>
    a.r === "All" ? -1 : b.r === "All" ? 1 : (+a.r.slice(1)) - (+b.r.slice(1)));
  const rd = rounds[Math.min(ri, rounds.length - 1)];
  const byHole = r => { const m = {}; r.h.forEach(h => m[h[0]] = h); return m; };
  const nums = rounds[0].h.map(h => h[0]);
  const pars = byHole(rounds[0]);
  const sel = byHole(rd)[hole] || rd.h.reduce((a, b) => a[10] < b[10] ? a : b);
  const all = rounds.find(r => r.r === "All") || rounds[0];
  const hardest = all.h.reduce((a, b) => a[10] < b[10] ? a : b);
  const easiest = all.h.reduce((a, b) => a[10] > b[10] ? a : b);
  const fieldAvg = all.h.reduce((n, h) => n + h[3], 0);
  const tot = sel[5] + sel[6] + sel[7] + sel[8] + sel[9];
  const seg = (i, k) => `<i class="s-${k}" style="width:${(sel[i] / tot * 100).toFixed(2)}%"></i>`;

  /* data-r stays the index into `rounds`, so click handling is unaffected by
     where a row is drawn */
  const gridRows = rounds.map((r, i) => r.r === "All" ? "" :
    fieldRow(r.r, nums, byHole(r), {data: i, selHole: i === ri ? sel[0] : -1})).join("");
  const allIdx = rounds.findIndex(r => r.r === "All");
  const allByHole = allIdx < 0 ? null : byHole(rounds[allIdx]);
  const here = pid ? (scoreCard(pid, t.id) || []).filter(r => !r.c || r.c === c.name) : [];
  /* the field's all-rounds line closes the field block, and stays clickable -
     it is still how you get back to "All rounds" */
  const fieldAll = allByHole
    ? fieldRow("Field", nums, allByHole,
               {cls: "all", data: allIdx, selHole: allIdx === ri ? sel[0] : -1})
    : "";
  const summary = summaryRows(nums, allByHole, here,
    pid ? nameOf(pid, (t.leaderboard.find(r => r.id === pid) || {}).name) : "", {}, false);

  return `<div class="hpanel" data-ci="${ci}" data-ri="${ri}" data-hole="${sel[0]}" data-pid="${esc(pid)}">
    <div class="hptop">
      ${cs.length > 1
        ? `<div class="hpills">${cs.map((x, i) =>
            `<button class="${i === ci ? "on" : ""}" data-c="${i}"
              title="${esc(x.name)}">${esc(courseLabel(x.name))}</button>`).join("")}</div>`
        : `<div class="hcourse">${esc(c.name)}</div>`}
    </div>

    <div class="hcov">${(() => {
      if (rd.r === "All") {
        const played = rounds.filter(r => r.r !== "All").length;
        const days = cs.reduce((n, x) =>
          Math.max(n, x.rounds.filter(r => r.r !== "All").length), 0);
        return `<b>All rounds</b> · ${pts(roundField(rd))} rounds played on this course` +
          (played < days ? ` — only ${played} of the event's ${days} days` : "");
      }
      const rn = +rd.r.slice(1);
      const fieldN = roundField(rd);
      const our = roundOurs(t, c.name, rn);
      return `<b>Round ${rn}</b> · ${fieldN} of the ${t.field} in the field played here` +
        (our > 0 && our < fieldN ? ` · ${our} scorecards held` : "");
    })()}</div>

    <div class="hkpis">
      <span>Par <b>${c.par}</b></span>
      <span><b>${esc(c.yards || "")}</b> yds</span>
      <span>Field average <b>${fieldAvg.toFixed(2)}</b></span>
      <span class="hard">Hardest <b>${hardest[0]}</b> (${d2(hardest[4])})</span>
      <span class="easy">Easiest <b>${easiest[0]}</b> (${d2(easiest[4])})</span>
    </div>

    <div class="hgrid">
      ${gridHead(nums, Object.fromEntries(nums.map(n => [n, pars[n][1]])))}
      <div class="sclab fieldlab"><b>The field</b><span>average against par, by round</span>
        <i>click a cell for that hole</i></div>
      ${gridRows}
      ${fieldAll}

      <div class="hbox">
        <div class="hdet">
          <div class="lead">Hole <b>${sel[0]}</b> · par ${sel[1]} · ${pts(sel[2])} yds ·
            <span style="color:var(--dim2)">${esc(rd.r === "All" ? "all rounds" : "round " + rd.r.slice(1))}</span><br>
            avg <i>${sel[3].toFixed(3)}</i> (${d2(sel[4])}) ·
            ${sel[10]}${sel[10] === 1 ? "st" : sel[10] === 2 ? "nd" : sel[10] === 3 ? "rd" : "th"} hardest</div>
          <div>
            <div class="hmix">${seg(5, "eagle")}${seg(6, "birdie")}${seg(7, "par")}${seg(8, "bogey")}${seg(9, "dbl")}</div>
            <div class="hcounts">
              <span><b>${sel[5]}</b>eagle+</span><span><b>${sel[6]}</b>birdie</span>
              <span><b>${sel[7]}</b>par</span><span><b>${sel[8]}</b>bogey</span>
              <span><b>${sel[9]}</b>double+</span><span><b>${pts(tot)}</b>scores</span>
            </div>
          </div>
        </div>
      </div>

      ${playerRows(t, c, nums, pid)}
      ${summary}
    </div>
  </div>`;
}

/* --------------------------------------------------------- chart cards */
function raceCard() {
  const top = P.slice(0, 30), max = top[0].points;
  return `<div class="card" data-k="race"><div class="inner"><div class="chartwrap">
    <div class="chead">
      <div><div class="crumb"><b>The Race</b></div>
        <div class="ctitle">2026 FedExCup points</div></div>
      <div class="cnote">Points earned across the 37-event FedExCup season, recomputed by summing
        every player's per-event award. The TOUR Championship awards no points — it decides the Cup
        itself — so this list is settled after the BMW Championship. Top 30 of 70 shown.</div>
    </div>
    <div class="rows">${top.map((p, i) => `
      <div class="rrow"><span class="rk">${i + 1}</span>
        <div class="bar"><div class="fill" style="width:${(p.points / max * 100).toFixed(1)}%"></div>
          <div class="blab"><span class="who">${esc(p.name)}</span>
            <span class="val">${pts(p.points)}</span></div></div></div>`).join("")}
    </div>
  </div></div></div>`;
}

function divergeCard() {
  const rows = P.filter(p => p.owgr).slice(0, 30)
    .map(p => ({...p, gap: p.owgr.rank - p.rank}));
  const cell = p => {
    const cls = p.gap > 0 ? "up" : p.gap < 0 ? "down" : "flat";
    const sign = p.gap > 0 ? "+" : "";
    return `<div class="drow">
      <span class="rk" style="color:var(--dim2);text-align:right">${p.rank}</span>
      <span class="nm">${esc(p.name)}</span>
      <span class="n1" style="color:var(--acc)">${pts(p.points)}</span>
      <span class="n2" style="color:var(--acc2)">#${p.owgr.rank}</span>
      <span class="dd ${cls}">${p.gap === 0 ? "—" : sign + p.gap}</span></div>`;
  };
  const head = `<div class="drow h"><span></span><span>Player</span>
    <span class="n1">FedExCup</span><span class="n2">World</span><span class="dd">Gap</span></div>`;
  return `<div class="card" data-k="diverge"><div class="inner"><div class="chartwrap">
    <div class="chead">
      <div><div class="crumb"><b>Two rankings</b></div>
        <div class="ctitle">FedExCup vs the world</div></div>
      <div class="cnote">The FedExCup counts one PGA TOUR season; the Official World Golf Ranking is a
        rolling two-year average across every tour. A positive gap means the world ranking rates a
        player lower than his 2026 season did. The two lists can disagree sharply: only 68 of these
        70 appear in the world top 600 at all, and two of the world's top 25 — Jon Rahm at No. 14 and
        Tyrrell Hatton at No. 24 — finished outside the FedExCup 70 and so have no card here.</div>
    </div>
    <div class="dcols">${head}${rows.slice(0, 14).map(cell).join("")}${head}${rows.slice(14, 28).map(cell).join("")}</div>
  </div></div></div>`;
}

function moneyCard() {
  const by = P.slice().sort((a, b) => cash(b.season.money) - cash(a.season.money)).slice(0, 30);
  const max = cash(by[0].season.money);
  const row = (p, i) => `<div class="mrow">
    <span class="rk">${i + 1}</span>
    <img class="fc" src="img/face/${p.id}.webp" alt="" loading="lazy">
    <span class="nm"><b>${esc(shortName(p))}</b><i>#${p.rank}</i></span>
    <div class="bar"><div class="fill" style="width:${(cash(p.season.money) / max * 100).toFixed(1)}%"></div></div>
    <span class="amt">${abbrMoney(p.season.money)}</span></div>`;
  return `<div class="card" data-k="money"><div class="inner"><div class="chartwrap">
    <div class="chead">
      <div><div class="crumb"><b>The money</b></div>
        <div class="ctitle">2026 official earnings</div></div>
      <div class="cnote">Official money won on the PGA TOUR in 2026, with each player's FedExCup
        points rank beside his name. The two orders come apart because the TOUR Championship pays
        a $40m bonus pool and awards no points at all: Viktor Hovland finished second at East Lake
        and ranks 6th for money against 26th for points. Top 30 of 70 shown.</div>
    </div>
    <div class="mcols">${by.map(row).join("")}</div>
  </div></div></div>`;
}

function holesCard() {
  const by = P.slice().sort((a, b) => (b.scoring?.holes || 0) - (a.scoring?.holes || 0));
  const max = by[0].scoring.holes;
  const SEG = [["eagle", "Eagle or better"], ["birdie", "Birdie"], ["par", "Par"],
               ["bogey", "Bogey"], ["dbl", "Double or worse"]];
  const row = (p, i) => {
    const sc = p.scoring, h = sc.holes || 1;
    const segs = SEG.map(([k]) =>
      `<i class="s-${k}" style="width:${(sc[k] / h * 100).toFixed(2)}%"></i>`).join("");
    const pct = k => (sc[k] / h * 100).toFixed(1);
    return `<div class="hrow" title="${esc(p.name)} — ${sc.holes} holes · ${pct("birdie")}% birdies">
      <span class="rk">${i + 1}</span>
      <span class="nm">${esc(shortName(p))}</span>
      <div class="htrack"><div class="hbar" style="--w:${(h / max * 100).toFixed(1)}%">${segs}</div></div>
      <span class="hn">${pts(sc.holes)}</span></div>`;
  };
  return `<div class="card" data-k="holes"><div class="inner"><div class="chartwrap">
    <div class="chead">
      <div><div class="crumb"><b>Every hole played</b></div>
        <div class="ctitle">2026 holes &amp; how they were scored</div></div>
      <div class="cnote">All 70 players, ranked by holes played in the FedExCup season — bar length
        is the number of holes, the fill is what those holes were scored. 95,000 holes in all:
        62% pars, 22% birdies, 13% bogeys. Alternate-shot rounds record no individual scores, so the
        Zurich Classic is not counted here.</div>
    </div>
    <div class="hkey">${SEG.map(([k, lbl]) =>
      `<span><b class="s-${k}"></b>${lbl}</span>`).join("")}
      <div class="hmode">
        <button class="on" data-mode="abs">Holes played</button>
        <button data-mode="pct">Share %</button>
      </div>
    </div>
    <div class="hcols">${by.map(row).join("")}</div>
  </div></div></div>`;
}

/* -------------------------------------------------------------- render */
const film = document.getElementById("film");
film.innerHTML = CARDS.map(c =>
  c.kind === "player" ? playerCard(c.d) :
  c.kind === "tournament" ? tournamentCard(c.d) :
  c.kind === "race" ? raceCard() :
  c.kind === "money" ? moneyCard() :
  c.kind === "holes" ? holesCard() : divergeCard()).join("");

let cur = 0, playing = null;
const total = CARDS.length;
document.getElementById("count").innerHTML = `<b>1</b> / ${total}`;

function go(n) {
  cur = Math.max(0, Math.min(total - 1, n));
  film.style.transform = `translateX(${-cur * 100}vw)`;
  document.getElementById("count").innerHTML = `<b>${cur + 1}</b> / ${total}`;
  document.body.classList.toggle("onplayer", CARDS[cur].kind === "player");
  const sec = cur >= SEC[2] ? 2 : cur >= SEC[1] ? 1 : 0;
  document.querySelectorAll("#tb-tabs button").forEach((b, i) =>
    b.classList.toggle("on", i === sec));
  document.getElementById("tb-ctx").textContent =
    sec === 0 ? `· FedExCup Ranking · Nos. 1\u2013${P.length}` :
    sec === 1 ? `· The Season · ${T.length} tournaments` : "· Season charts";
  location.hash = cur ? "#" + (cur + 1) : "";
}
const next = () => go(cur + 1 >= total ? 0 : cur + 1);
const prev = () => go(cur - 1);

document.getElementById("b-next").onclick = next;
document.getElementById("b-prev").onclick = prev;
document.getElementById("b-first").onclick = () => go(0);
document.getElementById("b-help").onclick = openHelp;
document.getElementById("b-play").onclick = e => {
  const btn = e.currentTarget;
  if (playing) { clearInterval(playing); playing = null;
    btn.innerHTML = `<svg viewBox="0 0 24 24"><path d="M7 4l12 8-12 8z"/></svg>`; }
  else { playing = setInterval(next, 4200);
    btn.innerHTML = `<svg viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></svg>`; }
};
document.getElementById("b-full").onclick = () =>
  document.fullscreenElement ? document.exitFullscreen() :
    document.documentElement.requestFullscreen?.();
document.querySelectorAll("#tb-tabs button").forEach(b =>
  b.onclick = () => go(SEC[+b.dataset.sec]));
document.getElementById("count").onclick = openJump;

addEventListener("keydown", e => {
  if (e.key === "Escape") {
    if (document.querySelector(".modal.on"))
      return document.querySelectorAll(".modal.on").forEach(m => m.classList.remove("on"));
    return closeInlineEvent(film.children[cur]);   // then the inline event panel
  }
  if (document.getElementById("emodal").classList.contains("on")) {
    if (e.key === "ArrowRight") { e.preventDefault(); stepEvent(1); }
    if (e.key === "ArrowLeft") { e.preventDefault(); stepEvent(-1); }
    return;
  }
  if (document.querySelector(".modal.on")) return;
  if (e.key === "ArrowUp" || e.key === "ArrowDown") {
    if (stepList(film.children[cur], e.key === "ArrowDown" ? 1 : -1)) {
      e.preventDefault();
      return;
    }
  }
  if (e.key === "ArrowRight" || e.key === " ") { e.preventDefault(); next(); }
  if (e.key === "ArrowLeft") prev();
  if (e.key === "Home") go(0);
  if (e.key === "End") go(total - 1);
  if (e.key === "?" || e.key === "h") openHelp();
  if (e.key === "g" || e.key === "/") { e.preventDefault(); openJump(); }
  if (e.key === "f") document.getElementById("b-full").click();
});

let tx = 0, ty = 0;
addEventListener("touchstart", e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, {passive: true});
addEventListener("touchend", e => {
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
  if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.4) dx < 0 ? next() : prev();
}, {passive: true});

addEventListener("hashchange", () => {
  const n = parseInt(location.hash.slice(1), 10);
  if (n && n - 1 !== cur) go(n - 1);
});
const start = parseInt(location.hash.slice(1), 10);
go(start ? start - 1 : 0);   // always run once so body.onplayer is set on first paint

/* --------------------------------------------- remembered preferences */
/* localStorage throws in some privacy modes, so every access is guarded */
const PREF = {
  get(k, d) { try { return localStorage.getItem("pga." + k) || d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("pga." + k, v); } catch (e) {} },
};

/* the tab is a single choice across every player card, so paging through
   the field keeps showing whatever you asked for */
function setTab(name, remember) {
  document.querySelectorAll('.card[data-k="player"]').forEach(card => {
    card.querySelectorAll(".tab").forEach(t => t.classList.toggle("on", t.dataset.tab === name));
    card.querySelectorAll("[data-pane]").forEach(p => p.hidden = p.dataset.pane !== name);
  });
  if (remember) PREF.set("tab", name);
}

function setHoleMode(mode, remember) {
  const card = document.querySelector('.card[data-k="holes"]');
  if (!card) return;
  card.querySelectorAll(".hmode button").forEach(b =>
    b.classList.toggle("on", b.dataset.mode === mode));
  card.querySelector(".hcols").classList.toggle("pct", mode === "pct");
  if (remember) PREF.set("holeMode", mode);
}

(() => {
  const t = PREF.get("tab", "results");
  if (t === "stats") setTab(t, false);        // "majors" may sit in an old localStorage
  const m = PREF.get("holeMode", "abs");
  if (m === "pct") setHoleMode(m, false);
})();

/* The two columns of a tournament card are one instrument: the heat map draws
   the selected player's card in its own columns, and the leaderboard carries the
   selected hole's score for everyone. Portrait stacks them a screen apart, so
   there the row still opens the modal instead. */
const isLandscape = () => innerWidth > innerHeight;

function syncTournament(card, ci, ri, hole, pid) {
  const t = byId[card.dataset.tid];
  card.querySelector(".hpanel").outerHTML = holePanel(t, ci, ri, hole, pid);
  const hp = card.querySelector(".hpanel");
  const right = card.querySelector(".t-right");
  const c = t.holes[Math.min(+hp.dataset.ci, t.holes.length - 1)];
  const rounds = c.rounds.slice().sort((a, b) =>
    a.r === "All" ? -1 : b.r === "All" ? 1 : (+a.r.slice(1)) - (+b.r.slice(1)));
  const rd = rounds[Math.min(+hp.dataset.ri, rounds.length - 1)];
  const h = +hp.dataset.hole;

  right.querySelectorAll(".lbrow").forEach(row => {
    row.classList.toggle("sel", !!pid && t.leaderboard[+row.dataset.i].id === pid);
  });

  if (rd.r === "All") { right.classList.remove("hole"); return; }
  const rn = +rd.r.slice(1);
  right.classList.add("hole");
  right.querySelector(".lbhead .hs").textContent = "H" + h;
  right.querySelectorAll(".lbrow").forEach(row => {
    const el = row.querySelector(".hs");
    const r = t.leaderboard[+row.dataset.i];
    const cd = scoreCard(r.id, t.id);
    const played = cd && cd.find(x => x.n === rn && (!x.c || x.c === c.name));
    const v = played && played.s[h - 1];
    el.innerHTML = v ? `<span class="sq ${SCLASS(v - (+played.p[h - 1]))}">${v}</span>`
                     : `<i>\u2013</i>`;
    el.title = v ? `${esc(r.name)} · hole ${h} · round ${rn}` : "";
  });
}

/* Up and down step the list the card is reading from - a player's season while
   an event panel is open, a tournament's leaderboard while a card is drawn.
   Returns false when there is nothing to step, so the key falls through. */
function stepList(card, d) {
  const kind = CARDS[cur].kind;
  let rows;
  if (kind === "player") {
    const box = card.querySelector(".pevent");
    if (!box || box.hidden) return false;
    rows = [...card.querySelectorAll('.evlist[data-pane="results"] .ev')];
  } else if (kind === "tournament") {
    const hp = card.querySelector(".hpanel");
    if (!hp || !hp.dataset.pid) return false;
    rows = [...card.querySelectorAll(".lbrow.has")];
  } else return false;

  const i = rows.findIndex(r => r.classList.contains("sel"));
  if (i < 0) return false;
  const n = Math.max(0, Math.min(rows.length - 1, i + d));
  if (n === i) return true;                       // already at an end, but ours
  rows[n].click();
  rows[n].scrollIntoView({block: "nearest", inline: "nearest"});
  return true;
}

/* ------------------------------------------------------- tabs + modals */
film.addEventListener("click", e => {
  const tab = e.target.closest(".tab");
  if (tab) { setTab(tab.dataset.tab, true); return; }
  const lbr = e.target.closest(".lbrow.has");
  if (lbr) {
    const card = lbr.closest(".card");
    if (!isLandscape()) { openFieldCard(card.dataset.tid, +lbr.dataset.i); return; }
    const hp = card.querySelector(".hpanel");
    if (!hp) { openFieldCard(card.dataset.tid, +lbr.dataset.i); return; }
    const id = byId[card.dataset.tid].leaderboard[+lbr.dataset.i].id;
    syncTournament(card, +hp.dataset.ci, +hp.dataset.ri, +hp.dataset.hole,
                   hp.dataset.pid === id ? "" : id);   // clicking again clears
    return;
  }
  const more = e.target.closest(".lbmore");
  if (more) {
    const lb = more.closest(".t-right").querySelector(".lb");
    const open = lb.classList.toggle("open");
    more.textContent = open ? "Show fewer" : `Show all ${more.dataset.n}`;
    if (open) {
      /* Drift down ten rows so it reads as a list that carries on. Reading a
         layout property first applies the overflow change - without it the
         element is not scrollable yet and the call does nothing. A hidden tab
         never animates a smooth scroll, so land it anyway if it never started. */
      void lb.offsetHeight;
      const row = lb.querySelector(".lbrow");
      const to = Math.round((row ? row.getBoundingClientRect().height + 1 : 24) * 10);
      lb.scrollTo({top: to, behavior: "smooth"});
      setTimeout(() => {
        if (lb.scrollTop === 0 && lb.classList.contains("open")) lb.scrollTop = to;
      }, 500);
    } else lb.scrollTop = 0;
    return;
  }
  const hp = e.target.closest(".hpanel");
  if (hp) {
    const cell = e.target.closest(".hcell:not(.na)");
    const cBtn = e.target.closest(".hpills button[data-c]");
    if (cell || cBtn) {
      const card = hp.closest(".card");
      const ci = cBtn ? +cBtn.dataset.c : +hp.dataset.ci;
      const ri = cBtn ? 0 : +cell.dataset.r;
      const hole = cBtn ? +hp.dataset.hole : +cell.dataset.h;
      syncTournament(card, ci, ri, hole, hp.dataset.pid || "");
      return;
    }
  }
  const mode = e.target.closest(".hmode button");
  if (mode) { setHoleMode(mode.dataset.mode, true); return; }
  const back = e.target.closest(".pback");
  if (back) { closeInlineEvent(back.closest(".card")); return; }
  const ev = e.target.closest(".ev");
  if (!ev) return;
  const card = ev.closest(".card");
  if (isLandscape()) openInlineEvent(card, ev.dataset.pid, ev.dataset.ev);
  else openEvent(ev.dataset.pid, ev.dataset.ev);
});

const byId = {};
T.forEach(t => byId[t.id] = t);

/* The scorecard modal reads two ways. Opened from a player card it walks that
   player's season; opened from a leaderboard it walks that tournament's field.
   Either way the arrows follow the list you clicked out of. */
let mMode = "season", mPid = null, mTid = null, mIdx = 0;

const mLen = () => mMode === "field"
  ? byId[mTid].leaderboard.length
  : (P.find(x => x.id === mPid) || {events: []}).events.length;

function openEvent(pid, tid) {
  const p = P.find(x => x.id === pid);
  if (!p) return;
  const i = p.events.findIndex(x => x.tid === tid);
  if (i < 0) return;
  mMode = "season"; mPid = pid; mIdx = i;
  renderEvent();
  document.getElementById("emodal").classList.add("on");
}

function openFieldCard(tid, i) {
  if (!byId[tid] || !byId[tid].leaderboard[i]) return;
  mMode = "field"; mTid = tid; mIdx = i;
  renderEvent();
  document.getElementById("emodal").classList.add("on");
}

function stepEvent(d) {
  const n = Math.max(0, Math.min(mLen() - 1, mIdx + d));
  if (n === mIdx) return;
  mIdx = n;
  renderEvent();
}

function renderEvent() {
  const v = mMode === "field" ? fieldView() : seasonView();
  const rounds = (v.rounds || []).filter(r => r && r !== "-");
  document.getElementById("ebody").innerHTML = `
    <div class="mplayer">${esc(v.who)}</div>
    <h3>${esc(v.title)}</h3>
    <p>${esc(v.sub)}</p>
    <div class="mgrid">
      <div><div class="k">Position</div><div class="v">${esc(v.pos || "—")}</div></div>
      <div><div class="k">Total</div><div class="v">${esc(v.total || "—")}</div></div>
      <div><div class="k">To par</div><div class="v">${esc(v.toPar || "—")}</div></div>
      ${v.pts !== undefined
        ? `<div><div class="k">FedExCup</div><div class="v">${v.pts ? pts(v.pts) : "0"}</div></div>` : ""}
      ${v.money !== undefined
        ? `<div><div class="k">Earnings</div><div class="v">${abbrMoney(v.money)}</div></div>` : ""}
    </div>
    ${rounds.length && !v.card ? `<div class="mrounds">${rounds.map((r, i) =>
      `<span><i>R${i + 1}</i>${esc(r)}</span>`).join("")}</div>` : ""}
    ${scorecard(v.card)}
    ${v.foot ? `<div class="mpager">${v.foot}</div>` : ""}
    <div class="mpager">${mIdx + 1} / ${mLen()} · ${v.nav}</div>`;
  const step = mMode === "field" ? "player" : "tournament";
  const prev = document.getElementById("e-prev"), next = document.getElementById("e-next");
  prev.disabled = mIdx === 0;
  next.disabled = mIdx === mLen() - 1;
  prev.title = `Previous ${step} (\u2190)`;
  next.title = `Next ${step} (\u2192)`;
}

/* one of the 70, stepping through their own season */
function seasonView() {
  const p = P.find(x => x.id === mPid);
  const e = p.events[mIdx];
  const t = byId[e.tid];
  return {
    who: `${p.name} · FedExCup No. ${p.rank}`,
    title: e.name,
    sub: t ? `${t.date} 2026 · ${t.course || ""}` : e.date,
    pos: e.pos, total: e.total, toPar: e.toPar, pts: e.pts || 0, money: e.money,
    rounds: e.rounds,
    card: scoreCard(p.id, e.tid),
    foot: t && t.champion.name !== p.name
      ? `Won by ${esc(t.champion.name)} · ${esc(t.champion.score || "")}` : "",
    nav: "\u2190 \u2192 to move through the season",
  };
}

/* anyone in the field, stepping down that week's leaderboard */
function fieldView() {
  const t = byId[mTid];
  const r = t.leaderboard[mIdx];
  const p = pById[r.id];
  const e = p && p.events.find(x => x.tid === t.id);
  const rounds = (r.rounds || []).filter(x => x && x !== "-");
  const strokes = rounds.reduce((n, x) => n + (+x || 0), 0);
  return {
    who: p ? `${p.name} · FedExCup No. ${p.rank}` : r.name + (r.amateur ? " (a)" : ""),
    title: t.name,
    sub: `${t.date} 2026 · ${t.course || ""}`,
    pos: r.pos, total: strokes || "", toPar: r.total,
    pts: e ? (e.pts || 0) : undefined,
    money: e ? e.money : undefined,
    rounds: r.rounds,
    card: scoreCard(r.id, t.id),
    foot: mIdx === 0 ? "" : `Won by ${esc(t.champion.name)} · ${esc(t.champion.score || "")}`,
    nav: "\u2190 \u2192 to move down the leaderboard",
  };
}
function scorecard(card) {
  if (!card || !card.length) return "";
  const sum = a => a.reduce((x, y) => x + y, 0);
  const hole = (v, p) => v ? `<div><span class="sq ${SCLASS(v - p)}">${v}</span></div>`
                           : `<div><span class="sq par">\u2013</span></div>`;
  const headRows = par => {
    const pOut = sum(par.slice(0, 9)), pIn = sum(par.slice(9));
    return `<div class="lab">Hole</div>
      ${par.slice(0, 9).map((_, i) => `<div class="hn">${i + 1}</div>`).join("")}
      <div class="hn">Out</div>
      ${par.slice(9).map((_, i) => `<div class="hn">${i + 10}</div>`).join("")}
      <div class="hn">In</div><div class="hn">Tot</div>
      <div class="lab">Par</div>
      ${par.slice(0, 9).map(p => `<div class="pr">${p}</div>`).join("")}
      <div class="pr">${pOut}</div>
      ${par.slice(9).map(p => `<div class="pr">${p}</div>`).join("")}
      <div class="pr">${pIn}</div><div class="pr">${pOut + pIn}</div>`;
  };
  const scoreRow = (r, withLabel) => {
    const par = r.p.split("").map(Number), sc = r.s;
    const out = sum(sc.slice(0, 9)), inn = sum(sc.slice(9));
    return (withLabel
        ? `<div class="rlab"><b>R${r.n}</b> ${r.t} <i>${toPar(r.tp)}</i></div>`
        : `<div class="lab">Score</div>`) + `
      ${sc.slice(0, 9).map((v, i) => hole(v, par[i])).join("")}
      <div class="sub">${out}</div>
      ${sc.slice(9).map((v, i) => hole(v, par[i + 9])).join("")}
      <div class="sub">${inn}</div><div class="tot">${out + inn}</div>`;
  };

  const pars = new Set(card.map(r => r.p));
  let body;
  if (pars.size === 1) {
    /* one course all week - the hole and par lines are stated once */
    body = `<div class="sc"><div class="scg wide">
      ${headRows(card[0].p.split("").map(Number))}
      ${card.map(r => scoreRow(r, true)).join("")}
    </div></div>`;
  } else {
    /* the week rotated courses, so each round carries its own par */
    body = card.map(r => `<div class="sc"><div class="scr">
        <b>Round ${r.n}</b>${r.c ? `<span>${esc(r.c)}</span>` : ""}
        <span>${r.t} <em>(${toPar(r.tp)})</em></span></div>
      <div class="scg">${headRows(r.p.split("").map(Number))}${scoreRow(r, false)}</div>
      </div>`).join("");
  }

  return `<h5>Scorecard</h5><div class="scwrap">${body}</div>
    <div class="sclegend">
      <span><i class="sq eagle" style="font-style:normal">2</i> Eagle or better</span>
      <span><i class="sq birdie" style="font-style:normal">3</i> Birdie</span>
      <span><i class="sq bogey" style="font-style:normal">5</i> Bogey</span>
      <span><i class="sq dbl" style="font-style:normal">6</i> Double or worse</span>
    </div>`;
}

function closeModal(id) { document.getElementById(id).classList.remove("on"); }
document.querySelectorAll(".modal").forEach(m =>
  m.addEventListener("click", e => { if (e.target === m) m.classList.remove("on"); }));

/* ---------------------------------------------------- jump to a card */
const INDEX = CARDS.map((c, i) => ({
  n: i + 1,
  kind: c.kind,
  label: c.kind === "player" ? c.d.name
       : c.kind === "tournament" ? c.d.name.replace(/ presented by .*$/i, "")
       : c.kind === "race" ? "The Race — 2026 FedExCup points"
       : c.kind === "holes" ? "Every hole played — 2026 scoring mix"
       : c.kind === "money" ? "The Money — 2026 official earnings"
       : "FedExCup vs the world",
  meta: c.kind === "player" ? `No. ${c.d.rank} · ${c.d.flag || c.d.country}`
      : c.kind === "tournament" ? c.d.date
      : "Chart",
  hay: (c.kind === "player"
      ? `${c.d.name} ${c.d.country} ${c.d.bio.college || ""}`
      : c.kind === "tournament"
      ? `${c.d.name} ${c.d.course || ""} ${c.d.city || ""} ${c.d.champion.name || ""}`
      : c.kind === "race" ? "chart race fedexcup points standings"
      : c.kind === "holes" ? "chart holes scoring birdies eagles bogeys mix"
      : c.kind === "money" ? "chart money earnings prize purse"
      : "chart world ranking owgr gap comparison").toLowerCase(),
}));

let jSel = 0;
function jRender(rows) {
  document.getElementById("jlist").innerHTML = rows.map((r, i) =>
    `<div class="jrow ${i === jSel ? "sel" : ""}" data-n="${r.n}">
       <span class="jn">${r.n}</span>
       <span><b>${esc(r.label)}</b></span>
       <span class="jt">${esc(r.meta)}</span></div>`).join("")
    || `<div class="jrow"><span class="jn">—</span><span>No card matches that.</span><span></span></div>`;
}
function jMatches() {
  const q = document.getElementById("jq").value.trim().toLowerCase();
  if (!q) return INDEX;
  if (/^\d+$/.test(q)) {
    const n = +q;
    return INDEX.filter(r => String(r.n).startsWith(q) || r.n === n).slice(0, 40);
  }
  return INDEX.filter(r => r.hay.includes(q)).slice(0, 40);
}
function jUpdate() { jRender(jMatches()); }

function openJump() {
  jSel = 0;
  const q = document.getElementById("jq");
  q.value = "";
  jUpdate();
  document.getElementById("jmodal").classList.add("on");
  setTimeout(() => q.focus(), 40);
}
document.getElementById("jq").addEventListener("input", () => { jSel = 0; jUpdate(); });
document.getElementById("jq").addEventListener("keydown", e => {
  const rows = jMatches();
  if (e.key === "ArrowDown") { e.preventDefault(); jSel = Math.min(rows.length - 1, jSel + 1); jRender(rows);
    document.querySelector(".jrow.sel")?.scrollIntoView({block: "nearest"}); }
  if (e.key === "ArrowUp") { e.preventDefault(); jSel = Math.max(0, jSel - 1); jRender(rows);
    document.querySelector(".jrow.sel")?.scrollIntoView({block: "nearest"}); }
  if (e.key === "Enter" && rows[jSel]) { closeModal("jmodal"); go(rows[jSel].n - 1); }
});
document.getElementById("jlist").addEventListener("click", e => {
  const row = e.target.closest(".jrow[data-n]");
  if (row) { closeModal("jmodal"); go(+row.dataset.n - 1); }
});
